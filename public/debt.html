      html+=`</div>`;
    }

    // ── Tight week triage ──
    const cycleIncome=incomeLog.reduce((s,e)=>s+e.amount,0);
    if(cycleIncome>0 && cycleIncome<tightThreshold*4.33){
      // This cycle looks tight - show triage
      const today=new Date().getDate();
      const unpaid=cyclePayments.filter(p=>paymentState(p.id)==='unpaid');
      const withPriority=unpaid.map(p=>{
        const debt=debts.find(d=>d.id===p.id);
        const daysUntilDue=debt?.due?((debt.due-today+31)%31):30;
        const inArrears=p.arrears;
        const isHighAPR=(debt?.apr||0)>25;
        const isTrade=debt?.account==='business'&&(debt?.min===0||!debt?.due);
        // Priority scoring
        let priority,color,bg,advice;
        if(p.unfunded){
          // Overdue with nothing allocated — the budget ran out before the
          // arrears queue reached it. There is no planned payment to quote,
          // so the figure that matters is what is overdue.
          priority='MUST PAY';color='#e05c5c';bg='#3a0d0d';
          advice=`${fmt(p.arrearsLeft)} overdue · nothing budgeted this cycle — pay what you can`;
        } else if(inArrears&&daysUntilDue<=7){
          priority='MUST PAY';color='#e05c5c';bg='#3a0d0d';
          advice='Already in arrears — missing this risks default';
        } else if(inArrears||daysUntilDue<=5){
          priority='MUST PAY';color='#e05c5c';bg='#3a0d0d';
          advice=inArrears?'In arrears — pay what you can':'Due very soon';
        } else if(daysUntilDue<=10||isHighAPR){
          priority='PAY SOON';color='#e0923b';bg='#2a1a0a';
          advice=daysUntilDue<=10?`Due in ~${daysUntilDue} days`:'High interest — pay before it grows';
        } else {
          priority='CAN WAIT';color='#7db87d';bg='#0d1a0d';
          advice=isTrade?'Trade account — contact if needed':`Due ${debt?.due?ord(debt.due):'flexibly'} — some breathing room`;
        }
        return {...p,priority,color,bg,advice,daysUntilDue,debt};
      }).sort((a,b)=>{
        const order={'MUST PAY':0,'PAY SOON':1,'CAN WAIT':2};
        return order[a.priority]-order[b.priority]||a.daysUntilDue-b.daysUntilDue;
      });

      html+=`<div class="card" style="border:1px solid #6a3a1a;background:#1a0f08;border-radius:12px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
          <span style="font-size:18px">⚠</span>
          <div>
            <div style="font-size:14px;font-weight:700;color:#e0923b">Tight week mode</div>
            <div style="font-size:12px;color:#7c7f96">Income logged (${fmt(cycleIncome)}) looks light — here's what to prioritise</div>
          </div>
        </div>`;
      withPriority.forEach(p=>{
        html+=`<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #2a1a0a">
          <div style="background:${p.bg};border:1px solid ${p.color}33;border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px">
            <div style="font-size:9px;font-weight:700;color:${p.color};letter-spacing:.06em;white-space:nowrap">${p.priority}</div>
          </div>
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <span style="font-weight:600;font-size:14px">${esc(p.name)}</span>
              <span style="font-weight:700;color:${p.color};flex-shrink:0;margin-left:8px">${p.unfunded?fmt(p.arrearsLeft):fmt(p.amount)}</span>
            </div>
            <div style="font-size:12px;color:#555;margin-top:2px">${p.advice}</div>
          </div>
        </div>`;
      });
      html+=`<div style="margin-top:12px;padding:10px;background:#0f0a06;border-radius:8px;font-size:12px;color:#7c7f96;line-height:1.6">
        Pay MUST PAY first, then SOON if you can. CAN WAIT items won't cause immediate damage — contact the creditor if you'll miss a due date.
      </div>
      <div style="margin-top:10px">
        <div style="font-size:11px;color:#555;margin-bottom:4px">Tight week threshold: <strong style="color:#e0923b">${fmt(tightThreshold)}</strong> — adjust below</div>
        <input type="range" min="300" max="1000" step="50" value="${tightThreshold}" oninput="setTightThreshold(this.value)" style="width:100%;accent-color:#e0923b">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#444"><span>£300</span><span>£1,000</span></div>
      </div>
      </div>`;
    }

    // Sweep setting
    html+=`<div class="card"><div class="row" style="align-items:center">
      <div><div style="font-size:13px;font-weight:600">Default sweep</div><div style="font-size:12px;color:#7c7f96;margin-top:2px">% of income that goes to the pot</div></div>
      <div style="font-weight:700;font-size:18px;color:#5b8def">${sweepPct}%</div>
    </div>
    <input type="range" min="20" max="80" step="5" value="${sweepPct}" oninput="setSweep(this.value)" style="width:100%;margin-top:10px;accent-color:#5b8def">
    <div class="slider-ends"><span>20%</span><span>80%</span></div>
    </div>`;

    // Buffer target. £0 = off, and off is the default — money only starts
    // being held back once a target is deliberately set. A slider was the
    // wrong control: it topped out at £500, and a month of minimums is
    // whatever this plan's minimums happen to add up to, so the figure is
    // typed (or taken from the plan in one tap) rather than dragged to.
    const mm=monthlyMinimums();
    html+=`<div class="card">
      <div class="row" style="align-items:center;margin-bottom:4px">
        <div><div style="font-size:13px;font-weight:600">Buffer pot target</div><div style="font-size:12px;color:#7c7f96;margin-top:2px">Cash held back before anything reaches the debts</div></div>
        <div style="font-weight:700;font-size:18px;color:${bufferTarget()>0?'#7db87d':'#555'}">${bufferTarget()>0?fmtS(bufferTarget()):'Off'}</div>
      </div>
      <div style="font-size:11px;color:#555;line-height:1.5;margin:8px 0 12px">A month ahead means holding one month of <strong style="color:#7c7f96">contractual minimums</strong> — ${fmt(mm.total)} on today's plan (${fmt(mm.biz)} business, ${fmt(mm.per)} personal). Miss a floor and you get a catch-up entry; miss a minimum and it becomes arrears.</div>
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
        ${[['One month ahead',1],['Half a month',0.5]].map(([label,f])=>`<button onclick="setBufferPreset(${f})" style="flex:1;min-width:120px;padding:8px;border-radius:6px;border:1px solid ${Math.abs(bufferTargetBiz-mm.biz*f)<0.02&&Math.abs(bufferTargetPer-mm.per*f)<0.02&&mm.total>0.005?'#7db87d':'#2a2d3e'};background:${Math.abs(bufferTargetBiz-mm.biz*f)<0.02&&Math.abs(bufferTargetPer-mm.per*f)<0.02&&mm.total>0.005?'#0d1a12':'#0f1117'};color:#7db87d;font-size:12px;font-weight:600">${label}<br><span style="font-size:10px;color:#555">${fmt(round2(mm.total*f))}</span></button>`).join('')}
        <button onclick="setBufferPreset(0)" style="flex:1;min-width:80px;padding:8px;border-radius:6px;border:1px solid ${bufferTarget()<=0.005?'#5a3a1a':'#2a2d3e'};background:#0f1117;color:#7c7f96;font-size:12px;font-weight:600">Off</button>
      </div>
      <div class="edit-grid">
        <div><div class="field-label" style="color:#e0923b">Business (£)</div><input class="field-input" type="number" inputmode="decimal" min="0" step="0.01" value="${bufferTargetBiz||''}" placeholder="0" oninput="setBufferTargetFor('business',this.value)"></div>
        <div><div class="field-label" style="color:#5b8def">Personal (£)</div><input class="field-input" type="number" inputmode="decimal" min="0" step="0.01" value="${bufferTargetPer||''}" placeholder="0" oninput="setBufferTargetFor('personal',this.value)"></div>
      </div>
      <div style="font-size:11px;color:#555;line-height:1.5;margin-top:10px">Two jars, because the pots are two real bank accounts — a full personal cushion can't pay a business minimum.</div>
    </div>`;

    // Notification settings
    html+=`<div class="card">
      <div class="row" style="align-items:center;margin-bottom:${notificationsEnabled?'10px':'0'}">
        <div><div style="font-size:13px;font-weight:600">Notifications</div><div style="font-size:12px;color:#7c7f96;margin-top:2px">Push reminders for upcoming due dates</div></div>
        <button onclick="toggleNotifications()" style="width:44px;height:24px;border-radius:12px;border:none;background:${notificationsEnabled?'#5b8def':'#2a2d3e'};position:relative;flex-shrink:0;padding:0">
          <div style="width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:${notificationsEnabled?'23px':'3px'};transition:left .15s"></div>
        </button>
      </div>`;
    if(notificationsEnabled){
      html+=`<div style="font-size:11px;color:#555;margin-bottom:6px">Notify this many days before a due date</div>
      <div style="display:flex;gap:6px;margin-bottom:12px">
        ${[1,2,3].map(n=>`<button onclick="setNotifyDays(${n})" style="flex:1;padding:8px;border-radius:6px;border:1px solid ${notifyDaysBefore===n?'#5b8def':'#2a2d3e'};background:${notifyDaysBefore===n?'#141a2e':'#0f1117'};color:${notifyDaysBefore===n?'#5b8def':'#7c7f96'};font-size:13px;font-weight:600">${n} day${n===1?'':'s'}</button>`).join('')}
      </div>
      ${renderDevicePushRow()}
      <button class="btn-ghost" style="width:100%" onclick="sendTestNotification()">Send test notification</button>
      ${notifyTestStatus?`<div style="font-size:11px;color:#7c7f96;margin-top:8px;text-align:center">${notifyTestStatus}</div>`:''}`;
    }
    html+=`</div>`;
  }

  // ---------- WHAT IF ----------
  else if(view==='whatif'){
    const baseMonths=months.length;
    const baseDate=getMonthLabel(baseMonths,true);
    html+=`<p class="desc">See how much a lump sum or extra monthly payment would accelerate your plan.</p>`;

    // Lump sum section
    html+=`<div class="card" style="border-radius:12px;margin-bottom:12px">
      <h2>One-off lump sum</h2>
      <div style="font-size:13px;color:#7c7f96;margin-bottom:14px">What if you threw an extra payment at your current target right now?</div>
      <div class="field-label">Extra amount (£)</div>
      <input id="lumpInput" class="field-input" type="number" inputmode="decimal" placeholder="e.g. 500" style="font-size:18px;padding:12px;margin-bottom:14px" oninput="calcLump()">
      <div id="lumpResult" style="display:none;background:#0f1117;border-radius:8px;padding:12px;font-size:13px">
        <div class="row" style="margin-bottom:8px">
          <span style="color:#7c7f96">Current debt-free date</span>
          <span style="font-weight:600">${baseDate}</span>
        </div>
        <div class="row" style="margin-bottom:8px">
          <span style="color:#7c7f96">New debt-free date</span>
          <strong id="lumpNewDate" style="color:#7db87d"></strong>
        </div>
        <div class="row" style="margin-bottom:4px">
          <span style="color:#7c7f96">Months saved</span>
          <strong id="lumpMonthsSaved" style="color:#7db87d;font-size:18px"></strong>
        </div>
        <div id="lumpTarget" style="font-size:11px;color:#555;margin-top:8px"></div>
      </div>
    </div>`;

    // Extra monthly section
    html+=`<div class="card" style="border-radius:12px;margin-bottom:12px">
      <h2>Extra every month</h2>
      <div style="font-size:13px;color:#7c7f96;margin-bottom:14px">What if you increased your monthly budget?</div>
      <label class="slider-label">Extra per month: <strong id="extraMonthlyLabel" style="color:#5b8def">${fmt(0)}</strong></label>
      <input type="range" min="0" max="1000" step="25" id="extraMonthlySlider" value="0" oninput="calcExtraMonthly(this.value)" style="width:100%;accent-color:#5b8def">
      <div class="slider-ends"><span>£0</span><span>+£1,000/mo</span></div>
      <div id="extraMonthlyResult" style="margin-top:14px;background:#0f1117;border-radius:8px;padding:12px;font-size:13px">
        <div class="row" style="margin-bottom:8px">
          <span style="color:#7c7f96">Current budget</span>
          <span style="font-weight:600">${fmt(budget)}/mo</span>
        </div>
        <div class="row" style="margin-bottom:8px">
          <span style="color:#7c7f96">New budget</span>
          <strong id="extraMonthlyBudget" style="color:#5b8def">${fmt(budget)}/mo</strong>
        </div>
        <div class="row" style="margin-bottom:8px">
          <span style="color:#7c7f96">New debt-free date</span>
          <strong id="extraMonthlyDate" style="color:#7db87d">${baseDate}</strong>
        </div>
        <div class="row">
          <span style="color:#7c7f96">Months saved</span>
          <strong id="extraMonthlySaved" style="color:#7db87d;font-size:18px">0</strong>
        </div>
      </div>
    </div>`;

    // Comparison table for common extra amounts
    const extras=[100,200,300,500];
    html+=`<div class="card" style="border-radius:12px">
      <h2>Quick comparison</h2>
      <div style="font-size:12px;color:#7c7f96;margin-bottom:12px">How different monthly increases change the finish line.</div>`;
    extras.forEach(extra=>{
      const newM=simulate(debts,budget+extra).length;
      const saved=baseMonths-newM;
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2a2d3e">
        <span style="font-size:13px;color:#e8e8ec">+${fmt(extra)}/mo</span>
        <div style="text-align:right">
          <div style="font-weight:700;color:#7db87d">${getMonthLabel(newM,true)}</div>
          <div style="font-size:11px;color:#555">${saved>0?saved+' months sooner':'no change'}</div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }

  // ---------- MONTHLY SCHEDULE ----------
  else if(view==='monthly'){
    const phase=cm?.phase==='arrears';
    html+=`<p class="desc">The full month-by-month plan. Phase 1 clears arrears, Phase 2 is the snowball.</p>
    <div class="phase-badge" style="background:${phase?'#3a1a1a':'#1a2535'};color:${phase?'#e05c5c':'#5b8def'};border:1px solid ${phase?'#5a2a2a':'#2a3d52'}">${phase?'⚠ Arrears phase':'❄ Snowball phase'}</div>
    ${phaseSwitch?`<span style="font-size:12px;color:#555;margin-left:10px">Snowball starts ${getMonthLabel(phaseSwitch.month,true)}</span>`:''}
    <div class="month-nav"><button onclick="changeMonth(-1)">‹</button>
      <div class="month-display"><div style="font-size:16px;font-weight:700;color:#fff">${getMonthLabel(selectedMonth)}</div><div style="font-size:11px;color:#7c7f96;margin-top:2px">Month ${selectedMonth} of ${totalMonths}</div></div>
      <button onclick="changeMonth(1)">›</button></div>`;
    if(cm){
      html+=`<div class="total-card"><div class="row"><div><div style="font-size:11px;color:#7c9fb5;text-transform:uppercase;letter-spacing:.08em">Total out this month</div><div style="font-size:26px;font-weight:700;color:#5b8def;margin-top:2px">${fmt(cm.totalOut)}</div></div></div></div>`;
      cm.payments.filter(p=>p.wasActive||p.total>0.005).forEach((p,i)=>{
        const debt=debts.find(d=>d.id===p.id);
        const isSB=p.extra>0.005,isArr=p.arrearsPaid>0.005,isClr=p.cleared&&p.wasActive;
        // In arrears but nothing allocated this month — the budget hasn't
        // reached it yet. Without this the row is a bare "—", which reads as
        // "nothing to do" rather than "overdue and waiting its turn".
        const isStarved=!isArr&&p.total<=0.005&&p.remainingArrears>0.005;
        const bg=isClr?'card-green':isSB||isArr?'card-blue':'';
        html+=`<div class="card ${bg}"><div class="row"><div style="display:flex;align-items:flex-start;gap:8px"><div class="dot" style="background:${COLORS[i%COLORS.length]}"></div><div>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-weight:600;font-size:15px">${esc(p.name)}</span>${isSB?'<span class="badge badge-blue">SNOWBALL</span>':''}${isArr?'<span class="badge badge-red">CLEARING ARREARS</span>':''}${isStarved?'<span class="badge badge-red">IN ARREARS</span>':''}${isClr?'<span class="badge badge-green">CLEARED ✓</span>':''}</div>
          <div style="font-size:12px;color:#7c7f96;margin-top:3px">${isSB?`Min <strong style="color:#e8e8ec">${fmt(p.minPaid)}</strong> + snowball <strong style="color:#5b8def">${fmt(p.extra)}</strong>`:''}${isArr?`Min <strong style="color:#e8e8ec">${fmt(p.minPaid)}</strong> + arrears <strong style="color:#e05c5c">${fmt(p.arrearsPaid)}</strong>`:''}${isStarved?`<strong style="color:#e05c5c">${fmt(p.remainingArrears)}</strong> overdue · waiting for budget`:''}${!isSB&&!isArr&&p.total>0.005?'Minimum payment':''}</div>
          ${debt?.due?`<div style="font-size:11px;color:#555;margin-top:2px">Due ${ord(debt.due)}</div>`:''}
          </div></div><div style="text-align:right;flex-shrink:0;margin-left:8px"><div style="font-size:22px;font-weight:700;color:${isClr?'#7db87d':isSB?'#5b8def':isArr?'#e05c5c':'#e8e8ec'}">${p.total>0.005?fmt(p.total):'—'}</div>${p.remaining>0.005?`<div style="font-size:11px;color:#555;margin-top:1px">${fmt(p.remaining)} left</div>`:''}</div></div></div>`;
      });
    }
  }

  // ---------- MILESTONES ----------
  else if(view==='milestones'){
    html+=`<p class="desc"><span style="color:#e05c5c;font-weight:600">Phase 1</span> — arrears cleared by ${phaseSwitch?getMonthLabel(phaseSwitch.month,true):'—'}. <span style="color:#5b8def;font-weight:600">Phase 2</span> — snowball.<br>Debt-free: <strong style="color:#7db87d">${getMonthLabel(totalMonths)}</strong></p>`;
    const active=debts.filter(d=>d.balance>0);
    active.forEach((d,i)=>{
      const m=milestones[d.id];
      html+=`<div style="display:flex;gap:12px;margin-bottom:12px;align-items:flex-start"><div class="milestone-line"><div class="milestone-dot" style="background:${m?COLORS[i%COLORS.length]:'#2a2d3e'}">${i+1}</div>${i<active.length-1?'<div class="connector"></div>':''}</div>
        <div class="card" style="flex:1;margin:0"><div class="row"><div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-weight:600">${esc(d.name)}</span>${d.arrears>0?'<span class="badge badge-red">ARREARS</span>':''}</div>
        <div style="font-size:12px;color:#7c7f96;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap"><span>${fmt(d.balance)}</span>${d.arrears>0?`<span style="color:#e05c5c">${fmt(d.arrears)} overdue</span>`:''}<span>${d.apr>0?d.apr+'% APR':'0%'}</span></div></div>
        <div style="text-align:right;flex-shrink:0;margin-left:10px"><div style="font-size:14px;font-weight:700;color:${m?'#7db87d':'#7c7f96'}">${m?getMonthLabel(m,true):'—'}</div>${m?`<div style="font-size:11px;color:#555">Month ${m}</div>`:''}</div></div></div></div>`;
    });
    const hmrc=debts.find(d=>d.id===11);
    html+=`<div class="card card-yellow"><div style="font-weight:600">HMRC — ${fmt(hmrc?.balance??0)}</div><div style="font-size:12px;color:#b5b07c;margin-top:4px">Not in the snowball. Call 0300 200 3835 to agree Time to Pay.</div></div>`;
  }

  // ---------- HISTORY ----------
  else if(view==='history'){
    const initialTotal=DEBTS_INITIAL.reduce((s,d)=>s+d.balance,0);
    const totalPaidAllTime=history.reduce((s,h)=>s+h.totalPaid,0);
    const latestTotal=history.length?history[0].debtSnapshot.reduce((s,d)=>s+d.balance,0):totalDebt;
    const totalReduction=initialTotal-latestTotal;
    html+=`<p class="desc">Every completed cycle, archived automatically — nothing is ever deleted.</p>`;
    html+=`<div class="total-card">
      <div class="row" style="margin-bottom:8px"><span style="color:#7c7f96;font-size:12px">Total paid across all cycles</span><strong style="color:#7db87d">${fmt(totalPaidAllTime)}</strong></div>
      <div class="row"><span style="color:#7c7f96;font-size:12px">Total debt reduction</span><strong style="color:#5b8def">${fmt(totalReduction)}</strong></div>
    </div>`;
    if(!history.length){
      html+=`<div class="card"><div style="font-size:13px;color:#7c7f96">No cycles completed yet — this fills in after your first "Start new cycle".</div></div>`;
    }
    history.forEach((h,i)=>{
      const cycleTotal=h.debtSnapshot.reduce((s,d)=>s+d.balance,0);
      const prev=history[i+1];
      const prevTotal=prev?prev.debtSnapshot.reduce((s,d)=>s+d.balance,0):initialTotal;
      const reduced=prevTotal-cycleTotal;
      const cleared=h.debtsPaid.filter(p=>{
        const snap=h.debtSnapshot.find(d=>d.id===p.id);
        return snap&&snap.balance<=0.005;
      });
      const dateRange=`${h.startedAt?new Date(h.startedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—'} → ${new Date(h.closedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`;
      const notes=parseCycleNotes(h.notes);
      html+=`<div class="card" style="border-radius:12px;margin-bottom:12px">
        <div class="row" style="margin-bottom:8px">
          <span style="font-weight:700;font-size:14px">Cycle ${h.cycleNumber}${notes.autoRolled?' <span class="badge" style="background:#2a2410;color:#e0c060;vertical-align:middle">AUTO</span>':''}</span>
          <span style="font-size:11px;color:#555">${dateRange}</span>
        </div>
        ${renderCycleVerdict(notes)}
        <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#7c7f96;margin-bottom:${reduced>0.005||cleared.length?'8px':'0'}">
          <span>In: <strong style="color:#e8e8ec">${fmt(h.totalIncome)}</strong></span>
          <span>Paid: <strong style="color:#7db87d">${fmt(h.totalPaid)}</strong></span>
          <span>Balance at close: <strong style="color:#e8e8ec">${fmtS(cycleTotal)}</strong></span>
        </div>
        ${reduced>0.005?`<div style="background:#0f1117;border-radius:6px;height:5px;overflow:hidden;margin-bottom:6px"><div style="width:${Math.min(100,Math.max(2,(reduced/Math.max(prevTotal,1))*100))}%;height:100%;background:#7db87d"></div></div><div style="font-size:11px;color:#7db87d;${cleared.length?'margin-bottom:6px':''}">${fmt(reduced)} reduced this cycle</div>`:''}
        ${cleared.length?`<div style="font-size:12px;color:#7db87d">🎉 Cleared: ${cleared.map(c=>esc(c.name)).join(', ')}</div>`:''}
      </div>`;
    });
  }

  // ---------- EDIT ----------
  else if(view==='edit'){
    html+=`<p class="desc">Update figures as things change. Tap Save to recalculate.<br><strong style="color:#7db87d">Floor</strong> is the minimum you've committed to — the number a creditor is told and held to. Leave it blank where nothing is agreed yet. The plan still pays the higher target figure whenever the money is there.</p>`;
    debts.forEach((d,i)=>{
      const ev=editDraft[d.id]||{balance:d.balance,apr:d.apr,min:d.min,arrears:d.arrears,due:d.due??'',account:d.account||'personal',note:d.note,floorPayment:d.floorPayment??''};
      html+=`<div class="card" style="border-radius:12px;margin-bottom:12px"><div class="row" style="align-items:center;margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px"><div class="dot" style="background:${COLORS[i%COLORS.length]};margin-top:0"></div><span style="font-weight:700;font-size:15px">${esc(d.name)}</span>${d.arrears>0?'<span class="badge badge-red">ARREARS</span>':''}</div><button onclick="openArchiveModal(${d.id})" style="background:none;border:none;color:#555;font-size:11px;font-weight:600;text-decoration:underline;padding:0;flex-shrink:0">archive</button></div>
      <div class="edit-grid">${[['balance','Balance (£)'],['arrears','Arrears (£)'],['apr','APR (%)'],['min','Min. Payment (£)'],['floorPayment','Floor (£)'],['due','Due Date (day)']].map(([f,label])=>`<div><div class="field-label"${f==='floorPayment'?' style="color:#7db87d"':''}>${label}</div><input class="field-input" type="number" min="0" step="${f==='apr'?'0.1':f==='due'?'1':'0.01'}" value="${ev[f]}"${f==='floorPayment'?' placeholder="not set"':''} oninput="updateDraft(${d.id},'${f}',this.value)"></div>`).join('')}<div><div class="field-label" style="color:${ev.account==='business'?'#e0923b':'#5b8def'}">Account</div><select class="field-input" style="background:#0f1117;color:#e8e8ec" onchange="updateDraft(${d.id},'account',this.value)"><option value="personal" ${ev.account==='personal'?'selected':''}>Personal</option><option value="business" ${ev.account==='business'?'selected':''}>Business</option></select></div><div style="grid-column:1/-1"><div class="field-label">Note</div><input class="field-input" type="text" value="${esc(ev.note||'')}" oninput="updateDraft(${d.id},'note',this.value)"></div></div></div>`;
    });
    html+=`<button class="btn-ghost" style="width:100%;margin-bottom:12px;border-style:dashed" onclick="openAddDebtModal()">+ Add debt</button>`;
    html+=`<div style="display:flex;gap:10px;margin-top:4px"><button id="saveBtn" class="btn-primary" style="flex:1" onclick="applyEdits()">Save &amp; Recalculate</button><button class="btn-ghost" onclick="resetDebts()">Reset</button></div>`;
    if(archivedDebts.length){
      html+=`<div class="card" style="border-radius:12px;margin-top:16px">
        <button onclick="archivedExpanded=!archivedExpanded;renderAll()" style="width:100%;background:none;border:none;color:#7c7f96;font-size:13px;font-weight:600;text-align:left;padding:0;cursor:pointer">${archivedExpanded?'▼':'▶'} Archived (${archivedDebts.length})</button>`;
      if(archivedExpanded){
        archivedDebts.forEach((d,i)=>{
          html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;${i<archivedDebts.length-1?'border-bottom:1px solid #2a2d3e':''};margin-top:${i===0?'12px':'0'}">
            <div>
              <span style="font-size:13px;color:#555">${esc(d.name)}</span>
              <div style="font-size:11px;color:#555;margin-top:1px">${fmt(d.balance)}${d.note?` · ${esc(d.note)}`:''}</div>
            </div>
            <button onclick="restoreDebt(${d.id})" style="padding:5px 10px;border-radius:6px;border:1px solid #3a3d52;background:transparent;color:#7c7f96;font-size:11px;font-weight:600">Restore</button>
          </div>`;
        });
      }
      html+=`</div>`;
    }
  }

  // ---------- OVERVIEW ----------
  else if(view==='overview'){
    html+=`<p class="desc">All debts at a glance.</p>`;
    debts.forEach((d,i)=>{
      html+=`<div class="card"><div class="row"><div style="display:flex;align-items:flex-start;gap:8px"><div class="dot" style="background:${COLORS[i%COLORS.length]}"></div><div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-weight:600;font-size:14px">${esc(d.name)}</span>${d.arrears>0?'<span class="badge badge-red">ARREARS</span>':''}</div>
      <div style="font-size:12px;color:#7c7f96;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap">${d.apr>0?`<span>${d.apr}% APR</span>`:''}${d.min>0?`<span>Min: ${fmt(d.min)}</span>`:''}${floorOf(d)!==null?`<span style="color:#7db87d">Floor: ${fmt(floorOf(d))}</span>`:''}${d.due?`<span>Due: ${ord(d.due)}</span>`:''}${d.arrears>0?`<span style="color:#e05c5c">Arrears: ${fmt(d.arrears)}</span>`:''}</div>
      ${d.note?`<div style="font-size:11px;color:#555;margin-top:3px;font-style:italic">${esc(d.note)}</div>`:''}</div></div>
      <div style="font-size:18px;font-weight:700;color:${d.balance===0?'#3a4a3a':'#e8e8ec'};flex-shrink:0;margin-left:8px">${fmt(d.balance)}</div></div></div>`;
    });
  }

  // ---------- BORROWED ----------
  // Standalone notes tab: no read/write of any other app state or calculation.
  else if(view==='borrowed'){
    html+=`<p class="desc">Track informal short-term borrowing — from people or from your own savings pots. Purely for notes; nothing here affects the debt plan.</p>`;
    const grandTotal=borrowedActive.reduce((s,b)=>s+b.amount,0);
    const sourceCount=new Set(borrowedActive.map(b=>b.source_name)).size;
    if(grandTotal<=0.005){
      html+=`<div class="card card-green" style="text-align:center;padding:20px;border-radius:12px;margin-bottom:16px">
        <div style="font-size:16px;font-weight:700;color:#7db87d">Nothing outstanding ✓</div>
        <div style="font-size:12px;color:#7c9f7c;margin-top:4px">Keep it that way.</div>
      </div>`;
    }else{
      html+=`<div class="total-card" style="background:linear-gradient(135deg,#1a2535,#141a2e);margin-bottom:16px">
        <div style="font-size:10px;color:#7c9fb5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Total borrowed</div>
        <div style="font-size:32px;font-weight:800;color:#fff">${fmt(grandTotal)}</div>
        <div style="font-size:12px;color:#7c7f96;margin-top:4px">${borrowedActive.length} active loan${borrowedActive.length===1?'':'s'} across ${sourceCount} source${sourceCount===1?'':'s'}</div>
      </div>`;
    }

    // Group active loans by source: savings-flagged first, then alphabetical.
    const groups={};
    borrowedActive.forEach(b=>{
      const key=b.source_name+'|'+b.is_savings;
      if(!groups[key])groups[key]={source_name:b.source_name,is_savings:b.is_savings,items:[],total:0};
      groups[key].items.push(b);
      groups[key].total+=b.amount;
    });
    const groupList=Object.values(groups).sort((a,b)=>{
      if(a.is_savings!==b.is_savings)return a.is_savings?-1:1;
      return a.source_name.localeCompare(b.source_name);
    });

    groupList.forEach(g=>{
      html+=`<div class="card" style="border-radius:12px;margin-bottom:12px">
        <div class="row" style="margin-bottom:8px;align-items:center">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="dot" style="background:${g.is_savings?'#7db87d':'#5b8def'};margin-top:0"></div>
            <span style="font-weight:700;font-size:15px">${esc(g.source_name)}</span>
            <span class="badge" style="background:${g.is_savings?'#0d1a0d':'#0a1228'};color:${g.is_savings?'#7db87d':'#5b8def'}">${g.is_savings?'SAVINGS':'PERSON'}</span>
          </div>
          <strong style="color:#e8e8ec">${fmt(g.total)} total</strong>
        </div>`;
      g.items.forEach((b,i)=>{
        html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;${i<g.items.length-1?'border-bottom:1px solid #2a2d3e':''}">
          <div>
            <div style="font-size:13px;color:${b.note?'#e8e8ec':'#555'}">${esc(b.note)||'No note'}</div>
            <div style="font-size:11px;color:#555;margin-top:1px">${formatBorrowedDate(b.borrowed_at)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <strong>${fmt(b.amount)}</strong>
            <button onclick="openRepayModal(${b.id})" style="padding:5px 10px;border-radius:6px;border:1px solid #2a4a2a;background:transparent;color:#7db87d;font-size:11px;font-weight:600">Repaid ✓</button>
          </div>
        </div>`;
      });
      html+=`</div>`;
    });

    html+=`<div style="${borrowedActive.length?'':'text-align:center'};margin-bottom:16px"><button class="btn-primary" ${borrowedActive.length?'style="width:100%"':'style="padding:12px 24px"'} onclick="openAddLoanModal()">+ Log a loan</button></div>`;

    html+=`<div class="card" style="border-radius:12px">
      <button onclick="repaidLogExpanded=!repaidLogExpanded;renderAll()" style="width:100%;background:none;border:none;color:#7c7f96;font-size:13px;font-weight:600;text-align:left;padding:0;cursor:pointer">${repaidLogExpanded?'▼':'▶'} Repaid (${borrowedRepaid.length})</button>`;
    if(repaidLogExpanded){
      borrowedRepaid.forEach((b,i)=>{
        html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;${i<borrowedRepaid.length-1?'border-bottom:1px solid #2a2d3e':''};margin-top:${i===0?'12px':'0'}">
          <div>
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:13px;color:#555">${esc(b.source_name)}</span>
              <span style="font-size:9px;color:#555;text-transform:uppercase;letter-spacing:.06em">${b.is_savings?'savings':'person'}</span>
            </div>
            <div style="font-size:11px;color:#555;margin-top:1px">${esc(b.note)||'No note'} · ${formatBorrowedDate(b.borrowed_at)} → ${formatBorrowedDate(b.repaid_at)}</div>
          </div>
          <strong style="color:#555;text-decoration:line-through">${fmt(b.amount)}</strong>
        </div>`;
      });
    }
    html+=`</div>`;
  }

  document.getElementById('tabContent').innerHTML=html;
}

// ---------- Floors & buffer rendering ----------
// The buffer sits under the two pots rather than beside them: three cards
// across is unreadable on a phone, and the buffer is a different kind of
// number — a cushion, not money earmarked for a payment.
function renderBufferStrip(){
  const held=bufferPot(),target=bufferTarget();
  if(target<=0.005){
    const mm=monthlyMinimums();
    return `<div style="display:flex;justify-content:space-between;align-items:center;background:#0d1512;border:1px solid #1e3a2e;border-radius:10px;padding:9px 12px;margin-bottom:14px">
      <div>
        <div style="font-size:10px;color:#7db87d;text-transform:uppercase;letter-spacing:.08em">Buffer pot</div>
        <div style="font-size:11px;color:#7c7f96;margin-top:2px">${held>0.005?`${fmt(held)} held · no target set`:mm.total>0.005?`Not set up — ${fmt(mm.total)} would put you a month ahead`:'Not set up — a cushion absorbs a bad month'}</div>
      </div>
      <button onclick="scrollToBufferSetting()" style="padding:5px 10px;border-radius:6px;border:1px solid #2a4a3a;background:transparent;color:#7db87d;font-size:11px;font-weight:600;flex-shrink:0">Set a target</button>
    </div>`;
  }
  const pct=Math.min(100,Math.round((held/target)*100));
  const full=held>=target-0.005;
  const cover=bufferCover();
  const drift=bufferDrift();
  // One line per account, because that is the level the money is actually
  // held and spent at — a full personal jar next to an empty business one is
  // not "83% of a month ahead", it is a business minimum about to be missed.
  const line=(label,col,pot,tgt)=>tgt<=0.005&&pot<=0.005?'':`<div class="row" style="align-items:center;margin-top:5px">
      <span style="font-size:11px;color:${col}">${label}</span>
      <span style="font-size:11px;color:${pot>=tgt-0.005?'#7db87d':'#7c7f96'}">${fmt(pot)}<span style="color:#555"> / ${fmt(tgt)}</span></span>
    </div>`;
  return `<div style="background:#0d1512;border:1px solid #1e3a2e;border-radius:10px;padding:9px 12px;margin-bottom:14px">
    <div class="row" style="align-items:center;margin-bottom:6px">
      <div style="display:flex;align-items:baseline;gap:8px">
        <span style="font-size:10px;color:#7db87d;text-transform:uppercase;letter-spacing:.08em">Buffer pot</span>
        <span style="font-size:11px;color:#7c7f96">${full?'a month ahead ✓':`${fmt(target-held)} to go`}</span>
      </div>
      <strong style="font-size:15px;color:${full?'#7db87d':'#e8e8ec'}">${fmt(held)} <span style="font-size:11px;color:#555;font-weight:600">/ ${fmt(target)}</span></strong>
    </div>
    <div style="background:#0f1117;border-radius:6px;height:4px;overflow:hidden">
      <div style="width:${pct}%;height:100%;background:#7db87d;border-radius:6px;transition:width .3s"></div>
    </div>
    ${line('Business','#e0923b',bufferBiz,bufferTargetBiz)}
    ${line('Personal','#5b8def',bufferPer,bufferTargetPer)}
    ${cover.total>0.005?`<button onclick="openBufferCoverModal()" style="width:100%;margin-top:9px;padding:7px;border-radius:7px;border:1px solid #2a4a3a;background:#0f1a15;color:#7db87d;font-size:12px;font-weight:700">Fund this month — move ${fmt(cover.total)} across</button>
      <div style="font-size:10px;color:#555;margin-top:5px;line-height:1.4">Puts every floor and minimum still owing into the pots up front. Income then refills the buffer instead of paying the bills — which is what being a month ahead buys you.</div>`:''}
    ${drift.matters?`<div style="margin-top:9px;padding-top:8px;border-top:1px solid #16281f;font-size:10px;color:#e0c060;line-height:1.4">A month of minimums is now <strong>${fmt(drift.mm.total)}</strong> — ${drift.drift>0?`${fmt(drift.drift)} less than you're holding for`:`${fmt(-drift.drift)} more than your target`}. <button onclick="setBufferPreset(1)" style="background:none;border:none;padding:0;color:#e0c060;font-size:10px;font-weight:700;text-decoration:underline">Update the target</button></div>`:''}
  </div>`;
}
// Moving buffer money into the pots is a real bank transfer, so it says
// exactly which account sends what before it happens. It is a TRANSFER, not
// a payment: the money lands in the pot and the payment is then ticked

// ---------- Cash flow actions ----------
function getCycleTotals(){
  // Calculate how much is needed from each account this cycle. Missed debts
  // are out — the sweep shouldn't set money aside for a payment that
  // deliberately isn't happening.
  const cp=getCyclePayments().filter(p=>!p.missed);
  // Capped at the target: a lump sum well over what the plan asked for is
  // money spent, not a bigger bill still to fund, and counting the overshoot
  // here would have the next pay-in chasing an account that is already ahead.
  const need=p=>Math.min(p.amount,p.target);
  const businessTotal=cp.filter(p=>{const d=debts.find(x=>x.id===p.id);return d&&d.account==='business';}).reduce((s,p)=>s+need(p),0);
  const personalTotal=cp.filter(p=>{const d=debts.find(x=>x.id===p.id);return d&&d.account==='personal';}).reduce((s,p)=>s+need(p),0);
  return {businessTotal,personalTotal};
}
// One indented destination inside the transfers panel. The two headline
// figures are what leaves for each BANK; these say which pot inside it each

    <span id="${id}" style="font-size:12px;color:${colour};font-weight:600">£0.00</span>

}

// One allocation, read by both the live preview and the Allocate button, so
// what the modal shows is exactly what gets committed. Any override the user
// types wins over the computed figure for that line only.
function readOverride(id){
  const el=document.getElementById(id);
  if(!el)return null;
  return el.value===''?null:parseNum(el.value);
}
function currentAllocation(){
  const amt=parseNum(document.getElementById('logAmount')?.value||0);
  const auto=allocateIncome(amt);
  const oBuf=readOverride('logBuffer'),oBiz=readOverride('logBiz'),oPer=readOverride('logPer'),oSav=readOverride('logSaved');
  const buffer=oBuf!==null?oBuf:auto.buffer;
  const biz=oBiz!==null?oBiz:auto.biz;
  const per=oPer!==null?oPer:auto.per;
  const savings=oSav!==null?oSav:auto.savings;
  // An overridden buffer total is split between the two jars the way the
  // automatic one would have been — in proportion to what each still needs,
  // falling back to the targets, then evenly. The user types one figure
  // because they moved one lump of cash; it still has to land in two places.
  let bufBiz=auto.bufferBiz,bufPer=auto.bufferPer;
  if(oBuf!==null){
    const nBiz=Math.max(0,bufferTargetBiz-bufferBiz),nPer=Math.max(0,bufferTargetPer-bufferPer);
    const w=nBiz+nPer>0.005?nBiz/(nBiz+nPer)
      :bufferTargetBiz+bufferTargetPer>0.005?bufferTargetBiz/(bufferTargetBiz+bufferTargetPer):0.5;
    bufBiz=round2(buffer*w);bufPer=round2(buffer-bufBiz);
  }
  return {amt,auto,buffer,bufferBiz:bufBiz,bufferPer:bufPer,biz,per,savings,
    keep:Math.max(0,amt-buffer-biz-per-savings)};
}
function updateSweepPreview(){
  const a=currentAllocation();
  if(!a.amt)return;
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=fmt(val);};
  set('bufferPreview',a.buffer);
  set('bizPreview',a.biz);
  set('perPreview',a.per);
  set('savingsPreview',a.savings);
  set('keepPreview',a.keep);
  // The buffer is no longer one lump landing in the personal account: its
  // business share has to be transferred to the business account, because
  // that is the jar a business minimum will be paid out of.
  set('transferBiz',a.biz+a.bufferBiz);
  set('transferPer',a.per+a.savings+a.bufferPer+a.keep);
  // ...and where each part of those two goes once it lands. Four pots means
  // four figures; the headline totals alone can't tell you how to split them.
  set('transferBizPot',a.biz);
  set('transferBizBuffer',a.bufferBiz);
  set('transferPerPot',a.per);
  set('transferPerBuffer',a.bufferPer);
  set('transferSavings',a.savings);
  set('transferKeep',a.keep);
  const splitNote=document.getElementById('bufferSplitNote');
  if(splitNote)splitNote.textContent=a.buffer>0.005?`${fmt(a.bufferBiz)} biz · ${fmt(a.bufferPer)} per`:'';
  // Show the tight-week banner if below threshold
  const tightBanner=document.getElementById('tightWeekBanner');
  if(tightBanner)tightBanner.style.display=a.amt>0&&a.amt<tightThreshold?'block':'none';
  // Floors are the line that matters on a light week — say plainly whether
  // this pay-in leaves them covered.
  const floorNote=document.getElementById('floorCoverNote');
  if(floorNote){
    const fs=getFloorStatus();
    const shortAfter=Math.max(0,fs.outstandingBiz-bizPot-a.auto.floorBiz)+Math.max(0,fs.outstandingPer-perPot-a.auto.floorPer);
    if(fs.outstandingBiz+fs.outstandingPer<=0.005){floorNote.style.display='none';}
    else{
      floorNote.style.display='block';
      floorNote.style.color=shortAfter>0.005?'#e0923b':'#7db87d';
      floorNote.textContent=shortAfter>0.005
        ?`⚠ Still ${fmt(shortAfter)} short of this cycle's floors after this.`
        :`✓ Every floor this cycle is covered after this.`;
    }
  }
}
async function confirmLog(){
  const a=currentAllocation();
  if(a.amt<=0){closeModal();return;}
  const bizAmt=a.biz,perAmt=a.per,savedAmt=a.savings;
  const bufferBizAmt=a.bufferBiz,bufferPerAmt=a.bufferPer;
  bizPot+=bizAmt;
  perPot+=perAmt;
  savingsPot+=savedAmt;
  bufferBiz+=bufferBizAmt;
  bufferPer+=bufferPerAmt;
  const date=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const entry={amount:a.amt,bizAmt,perAmt,savedAmt,
    bufferAmt:round2(bufferBizAmt+bufferPerAmt),bufferBizAmt,bufferPerAmt,date};
  closeModal();renderAll();
  try{
    const res=await fetch('/debt/api/income',{method:'POST',headers:JSON_HEADERS,body:JSON.stringify(entry)});
    if(!res.ok)throw new Error('income save failed: '+res.status);
    const saved=await res.json();
    entry.id=saved.id;
  }catch(err){saveError=true;console.error('Failed to save income entry',err);}
  incomeLog.push(entry);
  persist('cashflow');renderAll();
}

// A cycle payment is in exactly one of five states: unpaid, floor (the
// committed minimum went out, the target didn't), paid (the full target),
// custom (an amount the user typed — a lump sum clearing arrears outright,
// or a part payment), or missed (nothing went out, deliberately). Every
// transition runs through here so the pot is refunded for whatever the old
// state took and charged for whatever the new one takes — the pot arithmetic
// was the easiest thing to get wrong when this was three separate toggles.
//
// custom shares paidThisCycle with paid rather than owning a fourth list:
// the amount that makes it custom is in the ledger already, and every "is
// this covered?" test now asks the ledger what actually went out instead of
// which list an id sits in.
function paymentState(id){
  if(paidThisCycle.includes(id))return appliedPayments[id]&&appliedPayments[id].custom?'custom':'paid';
  if(floorPaidThisCycle.includes(id))return 'floor';
  if(missedThisCycle.includes(id))return 'missed';
  return 'unpaid';
}
// Ticking a payment takes it off the debt there and then — the balance drops,
// and the arrears portion comes off the arrears — so the plan moves as you pay
// instead of standing still until the next manual balance sync. Every delta is
// recorded because none of them is simply "the payment": arrears are clamped
// to the balance, and the pot only gives what it actually holds.
// `meta` carries what the payment was measured against — the plan's target,
// the floor it had to clear and the contractual minimum inside it — so those
// figures survive in the ledger instead of being re-derived later from a
// balance the payment itself has already moved. A custom payment can be any
// amount, so without them nothing could tell an underpayment from a target
// met.
function applyPayment(id,amount,arrearsPart,snowball,meta){
  const debt=debts.find(d=>d.id===id);
  if(!debt)return;
  const isBiz=debt.account==='business';
  const potBefore=isBiz?bizPot:perPot;
  const potAfter=Math.max(0,potBefore-amount);
  const newBal=Math.max(0,debt.balance-amount);
  const newArr=Math.min(Math.max(0,debt.arrears-Math.max(0,arrearsPart||0)),newBal);
  appliedPayments={...appliedPayments,[id]:{
    name:debt.name,nominal:amount,snowball:!!snowball,
    amount:debt.balance-newBal,arrearsAmt:debt.arrears-newArr,potAmt:potBefore-potAfter,
    ...(meta||{})
  }};
  debts=debts.map(d=>d.id===id?{...d,balance:newBal,arrears:newArr}:d);
  if(isBiz)bizPot=potAfter; else perPot=potAfter;
}
// Puts back exactly what applyPayment took, pot included.
function unapplyPayment(id){
  const a=appliedPayments[id];
  if(!a)return;
  const debt=debts.find(d=>d.id===id);
  debts=debts.map(d=>d.id===id?{...d,balance:d.balance+a.amount,arrears:d.arrears+a.arrearsAmt}:d);
  if(debt?.account==='business')bizPot+=a.potAmt; else perPot+=a.potAmt;
  const rest={...appliedPayments};delete rest[id];appliedPayments=rest;
}
function setPaymentState(id,next){
  let p=getCyclePayments().find(x=>x.id===id);
  if(!p)return;
  const current=paymentState(id);
  if(current===next)next='unpaid'; // tapping the control you're already in undoes it
  // Leaving paid/floor restores the balance, the arrears and the pot from the
  // ledger — not from a re-run of the sim, which is now working off the
  // balance that payment already reduced.
  //
  // ...and `p` has to be re-read once it has, because getCyclePayments() is
  // derived from the balance the payment just moved. While a debt is
  // floor-paid it reports amount = the floor, so upgrading floor -> paid off
  // the stale `p` refunded the floor and charged the floor straight back: a
  // net no-op that flipped the state and left the pot short by the rest of
  // the target. Re-derive AFTER the unapply, when the balance is whole again
  // and `amount` means the target once more.
  if(current==='paid'||current==='floor'||current==='custom'){
    unapplyPayment(id);
    p=getCyclePayments().find(x=>x.id===id)||p;
  }
  // An unfunded arrears row asks for £0. Ticking it "paid" would record a
  // payment of nothing and strike the debt through while it is still overdue
  // — the checklist doesn't offer the tick, and neither does this.
  if(next==='paid'&&p.amount<=0.005)next='unpaid';
  paidThisCycle=paidThisCycle.filter(x=>x!==id);
  floorPaidThisCycle=floorPaidThisCycle.filter(x=>x!==id);
  missedThisCycle=missedThisCycle.filter(x=>x!==id);
  // Every applied payment records what it was measured against, computed
  // from the freshly re-derived row: the ledger then says what the cycle
  // asked for as well as what went out, whichever of the two the tick sent.
  const meta={target:p.amount,floorDue:p.floorDue,minAmt:p.minAmt};
  if(next==='paid'){
    paidThisCycle=[...paidThisCycle,id];
    applyPayment(id,p.amount,p.arrearsAmt,p.snowball,meta);
  }else if(next==='floor'){
    // Paying only the floor sends the contractual minimum, so it clears no
    // arrears unless the floor itself exceeds that minimum — the arrears
    // catch-up is the discretionary part on top, and that part wasn't paid.
    const due=p.floorDue||0;
    floorPaidThisCycle=[...floorPaidThisCycle,id];
    applyPayment(id,due,Math.max(0,due-(p.minAmt||0)),false,meta);
  }else if(next==='missed'){
    missedThisCycle=[...missedThisCycle,id];
  }
  persist('cashflow','debts');renderAll();
}
function togglePaid(id){setPaymentState(id,'paid');}
function togglePaidFloor(id){setPaymentState(id,'floor');}
function toggleMissed(id){setPaymentState(id,'missed');}
// Back to unpaid from any state. Deliberately not routed through
// setPaymentState: a custom payment can be on a debt that has no row in this
// cycle's plan at all, and setPaymentState gives up when it can't find one.
function undoPayment(id){
  if(appliedPayments[id])unapplyPayment(id);
  paidThisCycle=paidThisCycle.filter(x=>x!==id);
  floorPaidThisCycle=floorPaidThisCycle.filter(x=>x!==id);
  missedThisCycle=missedThisCycle.filter(x=>x!==id);
  persist('cashflow','debts');renderAll();
}

// ---------- Paying your own amount ----------
// The plan hands you two figures — the target and the floor — and until now
// they were the only two amounts a tick could send. A lump sum doesn't fit
// either: clearing an account's arrears outright is a payment of whatever
// that account happens to be behind by, which is neither number.
//
// Everything the modal quotes is stated as if the payment hadn't happened
// yet, because an already-applied payment has moved the very balance, arrears
// and pot the next amount has to be measured against. Adding its ledger entry
// back here (rather than un-applying for real) means CANCELLING the modal
// leaves the existing payment exactly as it was.
function payContext(id){
  const debt=debts.find(d=>d.id===id);
  if(!debt)return null;
  const a=appliedPayments[id];
  const row=getCyclePayments().find(p=>p.id===id);
  const balance=round2(debt.balance+(a?a.amount:0));
  const arrears=round2(debt.arrears+(a?a.arrearsAmt:0));
  const isBiz=debt.account==='business';
  const pot=round2((isBiz?bizPot:perPot)+(a?a.potAmt:0));
  // The contractual minimum inside the payment. It keeps the account current
  // rather than catching it up, so it clears no arrears — everything above
  // it does. Same split simulate() makes, and the one 'paid floor only' uses.
  const minAmt=a&&a.minAmt!=null?a.minAmt:row?row.minAmt:Math.min(Number(debt.min)||0,balance);
  // null target = no planned payment this cycle at all (a trade account with
  // no minimum, HMRC before Time to Pay). Such a debt can still be paid; it
  // just has nothing to be over or under.
  // An unfunded arrears row carries a target of £0, which is the same thing
  // as having no planned payment — say so rather than quoting "plan says
  // £0.00" at a debt the budget simply never reached.
  const target=a?(a.target??a.nominal):row&&row.target>0.005?row.target:null;
  return {debt,isBiz,balance,arrears,pot,minAmt,target,
    // Capped at the balance, never at the planned payment — see floorDueOf().
    floorDue:floorDueOf(debt,a?a.amount:0),
    // What it takes to leave nothing overdue: this month's minimum, then
    // every penny of the arrears on top.
    clearArrears:Math.min(balance,round2(minAmt+arrears))};
}
let customPayId=null;
function openCustomPayModal(id){
  const ctx=payContext(id);

  customPayId=id;
  const a=appliedPayments[id];

// What the amount in the box would actually do — the balance and arrears it
// leaves, what it takes out of the pot, and whether it still clears the floor.
function customPayPreview(){
  const el=document.getElementById('customPayPreview');
  const input=document.getElementById('customPayInput');
  const ctx=payContext(customPayId);
  if(!el||!input||!ctx)return;
  const typed=round2(parseNum(input.value));
  const amount=Math.min(typed,ctx.balance);
  const arrearsPart=Math.min(Math.max(0,amount-ctx.minAmt),ctx.arrears);
  const newBal=round2(Math.max(0,ctx.balance-amount));
  const newArr=round2(Math.min(Math.max(0,ctx.arrears-arrearsPart),newBal));
  const shortBy=round2(amount-ctx.pot);
  const line=(label,val)=>`<div class="row"><span style="color:#7c7f96">${label}</span><span style="font-weight:600">${val}</span></div>`;
  el.innerHTML=
    line('Balance',`${fmt(ctx.balance)} → <span style="color:${newBal<=0.005?'#7db87d':'#e8e8ec'}">${fmt(newBal)}</span>${newBal<=0.005?' <span style="color:#7db87d">cleared ✓</span>':''}`)+
    (ctx.arrears>0.005?line('Arrears',`${fmt(ctx.arrears)} → <span style="color:${newArr<=0.005?'#7db87d':'#e05c5c'}">${fmt(newArr)}</span>${newArr<=0.005?' <span style="color:#7db87d">cleared ✓</span>':''}`):'')+
    line(`${ctx.isBiz?'Business':'Personal'} pot`,`${fmt(ctx.pot)} → ${fmt(Math.max(0,ctx.pot-amount))}`)+
    (typed>ctx.balance+0.005?`<div style="color:#e0923b;margin-top:6px">Capped at the ${fmt(ctx.balance)} balance — you can't pay more than is owed.</div>`:'')+
    (shortBy>0.005?`<div style="color:#e0923b;margin-top:6px">${fmt(shortBy)} more than the pot holds. Log the money in first if it has landed, or the pot will just bottom out at zero.</div>`:'')+
    (ctx.floorDue!==null&&amount<ctx.floorDue-0.005?`<div style="color:#e0923b;margin-top:6px">Under the ${fmt(ctx.floorDue)} floor — this cycle will count that floor as unmet, and the shortfall goes on the catch-up ledger when it closes.</div>`:'')+
    (amount<=0.005?`<div style="color:#7c7f96;margin-top:6px">Enter an amount, or use “missed this cycle?” on the row to record paying nothing.</div>`:'');
}
function confirmCustomPay(){
  const id=customPayId;
  const ctx=payContext(id);
  const input=document.getElementById('customPayInput');
  if(!ctx||!input){closeModal();return;}
  const amount=Math.min(round2(parseNum(input.value)),ctx.balance);
  if(amount<=0.005){closeModal();return;} // nothing to record; the row keeps whatever state it had
  // Undo whatever was there before charging the new amount, so the pot is
  // refunded for the old payment rather than debited twice. ctx was read
  // BEFORE this, off the same pristine figures applyPayment is about to see.
  if(appliedPayments[id])unapplyPayment(id);
  paidThisCycle=paidThisCycle.filter(x=>x!==id);
  floorPaidThisCycle=floorPaidThisCycle.filter(x=>x!==id);
  missedThisCycle=missedThisCycle.filter(x=>x!==id);
  const arrearsPart=Math.min(Math.max(0,amount-ctx.minAmt),ctx.arrears);
  paidThisCycle=[...paidThisCycle,id];
  applyPayment(id,amount,arrearsPart,false,
    {custom:true,target:ctx.target==null?amount:ctx.target,floorDue:ctx.floorDue,minAmt:ctx.minAmt});
  customPayId=null;
  persist('cashflow','debts');closeModal();renderAll();
}

async function deleteIncome(idx){
  const e=incomeLog[idx];
  if(!e)return;
  bizPot=Math.max(0,bizPot-(e.bizAmt||0));
  perPot=Math.max(0,perPot-(e.perAmt||0));
  savingsPot=Math.max(0,savingsPot-(e.savedAmt||0));
  // Pre-split entries carry only the legacy total, which was personal money.
  bufferBiz=Math.max(0,bufferBiz-(e.bufferBizAmt||0));
  bufferPer=Math.max(0,bufferPer-(e.bufferPerAmt??e.bufferAmt??0));
  incomeLog.splice(idx,1);
  persist('cashflow');renderAll();
  if(e.id!=null){
    try{ await fetch('/debt/api/income/'+e.id,{method:'DELETE'}); }
    catch(err){ console.error('Failed to delete income entry',err); }
  }
}

// 'cycle' (the default) closes the cycle on save, as the manual flow always
// has. 'balances' just corrects the figures — used after an automatic
// rollover, where the cycle is already closed and archiving another one would
// leave an empty history row.
let syncMode='cycle';
function openSyncBalances(mode){
  syncMode=mode==='balances'?'balances':'cycle';
  // Closing a cycle: seed the draft with the PROJECTED balance after it
  // (month 1 of the sim), which is what the plan expects to happen and so a
  // realistic figure to tweak. Reconciling after an automatic rollover: seed
  // the CURRENT balance instead — the cycle already closed, so a projection
  // of the one that just began would be a month ahead of the statement.
  syncDraft={};
  const months=getSim();
  const m1=months[0];
  debts.forEach(d=>{
    if(d.balance<=0.005)return;
    let projected=d.balance;
    // 'balances' mode reconciles against a statement for a cycle that has
    // already closed, so the current figure is the right starting point and
    // no projection is applied at all.
    if(syncMode!=='cycle'){ syncDraft[d.id]=projected.toFixed(2); return; }
    // Already ticked: the payment has come off the balance already, so the
    // estimate is just that balance plus a month's interest. Using the sim's
    // month-1 remaining here would subtract the same payment a second time.
    if(appliedPayments[d.id]){
      projected=d.balance*(1+(d.apr/100/12));
    }
    // A missed debt had no payment this cycle, so its estimate stays at the
    // current balance instead of assuming the plan's payment happened.
    else if(m1&&!missedThisCycle.includes(d.id)){
      const p=m1.payments.find(x=>x.id===d.id);
      if(p&&p.wasActive){
        // A floor-only payment sent less than the plan assumed, so the
        // estimate has to come down by the floor, not the full payment.
        if(floorPaidThisCycle.includes(d.id)){
          const cp=getCyclePayments().find(x=>x.id===d.id);
          projected=Math.max(0,d.balance-(cp&&cp.floorDue!==null?cp.floorDue:0));
        }else projected=p.remaining;
      }
    }
    syncDraft[d.id]=projected.toFixed(2);
  });
  renderSyncModal();
}

// Balances-only save: an automatic rollover already closed and archived the
// cycle, so this writes the corrected figures and nothing else.
function confirmBalancesOnly(){
  debts=debts.map(d=>{
    if(syncDraft[d.id]===undefined)return d;
    const nb=parseNum(syncDraft[d.id]);
    return {...d,balance:nb,arrears:Math.min(d.arrears,nb)}; // arrears can't exceed the new balance

async function confirmSync(){

  // still clamps the rolled figure rather than the pre-roll one.
  applyUnpaidMinimums(archivePayload.arrearsAdded);

function renderDevicePushRow(){

  }else if(pushState==='busy'||pushState==='init'){

async function initPush(){
  if(!('serviceWorker' in navigator)){pushState='unsupported';renderAll();return;}
  // Register the worker before the push feature-detect: it also carries the
  // offline app-shell cache, which should work even where push doesn't
  // (e.g. a Safari tab, where PushManager only exists for installed apps).
  try{
    // Scope '/debt' out-specifics the estimator sw.js's '/' scope, so this
    // worker controls /debt and /debt.html.
    swRegistration=await navigator.serviceWorker.register('/debt-sw.js',{scope:'/debt'});
  }catch(err){
    console.error('Service worker registration failed',err);
    pushState='unsupported';renderAll();return;
  }
  if(!('PushManager' in window)||!('Notification' in window)){pushState='unsupported';renderAll();return;}
  try{
    const sub=await swRegistration.pushManager.getSubscription();
    if(sub){
      pushState='on';
      // Re-assert the subscription server-side: it costs one upsert and
      // heals the case where the DB row was lost (or iOS rotated keys).
      fetch('/debt/api/push/subscribe',{method:'POST',headers:JSON_HEADERS,body:JSON.stringify({subscription:sub.toJSON()})}).catch(()=>{});
    }else if(Notification.permission==='denied'){
      pushState='denied';
    }else{
      // iOS only exposes push to web apps launched from the Home Screen —
      // in a Safari tab the buttons would just fail, so show the install
      // hint instead.
      const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.userAgent.indexOf('Mac')!==-1&&'ontouchend' in document);
      const standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
      pushState=(isIOS&&!standalone)?'need-install':'off';
    }
  }catch(err){
    console.error('Push init failed',err);
    pushState='unsupported';
  }
  renderAll();
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function enableDevicePush(){
  pushState='busy';renderAll();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){pushState=perm==='denied'?'denied':'off';renderAll();return;}
    const keyRes=await fetch('/debt/api/push/public-key');
    if(!keyRes.ok)throw new Error('public key fetch failed');
    const {publicKey}=await keyRes.json();
    const sub=await swRegistration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(publicKey)});
    const res=await fetch('/debt/api/push/subscribe',{method:'POST',headers:JSON_HEADERS,body:JSON.stringify({subscription:sub.toJSON()})});
    if(!res.ok){await sub.unsubscribe().catch(()=>{});throw new Error('subscribe save failed');}
    pushState='on';
  }catch(err){
    console.error('Enable push failed',err);
    pushState='off';
    notifyTestStatus='Could not enable push on this device.';
    setTimeout(()=>{notifyTestStatus='';renderAll();},5000);
  }
  renderAll();
}

async function disableDevicePush(){
  pushState='busy';renderAll();
  try{
    const sub=swRegistration&&await swRegistration.pushManager.getSubscription();
    if(sub){
      await fetch('/debt/api/push/unsubscribe',{method:'POST',headers:JSON_HEADERS,body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{});
      await sub.unsubscribe();
    }
    pushState='off';
  }catch(err){console.error('Disable push failed',err);pushState='off';}
  renderAll();
}

      paidThisCycle=paidThisCycle.filter(x=>x!==id);
      missedThisCycle=missedThisCycle.filter(x=>x!==id);
      floorPaidThisCycle=floorPaidThisCycle.filter(x=>x!==id);
      persist('cashflow');
    }
  }catch(err){saveError=true;console.error('Failed to archive debt',err);}
  renderAll();
}
async function restoreDebt(id){
  if(!loadedFromServer)return;
  try{
    const body=await setDebtArchived(id,false);
    if(!body){renderAll();return;}
    archivedDebts=archivedDebts.filter(x=>x.id!==id);
    debts=[...debts,body.debt].sort((a,b)=>a.id-b.id);
    debtsUpdatedAt=body.updatedAt;
    selectedMonth=1;
  }catch(err){saveError=true;console.error('Failed to restore debt',err);}
  renderAll();
}
function resetDebts(){
  document.getElementById('modalRoot').innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2 style="font-size:18px;margin-bottom:12px">Reset all figures?</h2>
        <div style="font-size:13px;color:#7c7f96;margin-bottom:18px;line-height:1.5">This restores every debt to its original value. Your cash flow pot and log are not affected.</div>
        <div style="display:flex;gap:10px">
          <button class="btn-primary" style="flex:1" onclick="confirmReset()">Yes, reset</button>
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>`;
}
function confirmReset(){debts=DEBTS_INITIAL.map(d=>({...d}));editDraft={};selectedMonth=1;persist('debts');closeModal();renderAll();}

// ---------- Borrowed money actions ----------
function openRepayModal(id){
  const b=borrowedActive.find(x=>x.id===id);
  if(!b)return;
  document.getElementById('modalRoot').innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2 style="font-size:18px;margin-bottom:12px">Mark as repaid?</h2>
        <div style="font-size:13px;color:#7c7f96;margin-bottom:18px;line-height:1.5">
          <strong style="color:#e8e8ec">${fmt(b.amount)}</strong> borrowed from ${esc(b.source_name)}<br>
          ${esc(b.note)||'No note'} · ${formatBorrowedDate(b.borrowed_at)}
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn-primary" style="flex:1;background:#7db87d" onclick="confirmRepay(${id})">Yes, mark repaid</button>
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>`;
}
async function confirmRepay(id){
  closeModal();
  try{
    const res=await fetch('/debt/api/borrowed/'+id+'/repay',{method:'POST'});
    if(!res.ok)throw new Error('repay failed: '+res.status);
  }catch(err){ saveError=true;console.error('Failed to mark loan repaid',err); }
  await refreshBorrowed();renderAll();
}
function openAddLoanModal(){
  loanIsSavings=false;
  document.getElementById('modalRoot').innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2 style="font-size:18px;margin-bottom:16px">Log a loan</h2>
        <div class="field-label">Source name</div>
        <input id="loanSource" class="field-input" type="text" placeholder="e.g. Dave, Tax, Emergency fund" style="margin-bottom:14px">
        <div class="field-label">Type</div>
        <div style="display:flex;gap:8px;margin-bottom:14px">
          <button id="loanTypePerson" onclick="setLoanType(false)" style="flex:1;padding:10px;border-radius:6px;border:1px solid #5b8def;background:#141a2e;color:#5b8def;font-size:13px;font-weight:600">Person</button>
          <button id="loanTypeSavings" onclick="setLoanType(true)" style="flex:1;padding:10px;border-radius:6px;border:1px solid #2a2d3e;background:#1a1d2e;color:#7c7f96;font-size:13px;font-weight:600">Savings pot</button>
        </div>
        <div class="field-label">Amount (£)</div>
        <input id="loanAmount" class="field-input" type="number" inputmode="decimal" step="0.01" min="0" style="font-size:18px;padding:12px;margin-bottom:14px">
        <div class="field-label">What was it for? (optional)</div>
        <input id="loanNote" class="field-input" type="text" style="margin-bottom:14px">
        <div class="field-label">Date borrowed</div>
        <input id="loanDate" class="field-input" type="date" value="${new Date().toISOString().slice(0,10)}" style="margin-bottom:14px">
        <div id="loanError" style="display:none;color:#e05c5c;font-size:12px;margin-bottom:12px"></div>
        <div style="display:flex;gap:10px">
          <button class="btn-primary" style="flex:1" onclick="confirmAddLoan()">Save</button>
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById('loanSource')?.focus(),100); // ?. — modal may already be closed
}
function setLoanType(isSavings){
  loanIsSavings=isSavings;
  const p=document.getElementById('loanTypePerson');
  const s=document.getElementById('loanTypeSavings');
  if(isSavings){
    s.style.borderColor='#7db87d';s.style.background='#0d1a0d';s.style.color='#7db87d';
    p.style.borderColor='#2a2d3e';p.style.background='#1a1d2e';p.style.color='#7c7f96';
  }else{
    p.style.borderColor='#5b8def';p.style.background='#141a2e';p.style.color='#5b8def';
    s.style.borderColor='#2a2d3e';s.style.background='#1a1d2e';s.style.color='#7c7f96';
  }
}
async function confirmAddLoan(){
  const source=document.getElementById('loanSource').value.trim();
  const amount=parseNum(document.getElementById('loanAmount').value);
  const note=document.getElementById('loanNote').value.trim();
  const date=document.getElementById('loanDate').value;
  const errEl=document.getElementById('loanError');
  if(!source){errEl.textContent='Source name is required';errEl.style.display='block';return;}
  if(!amount||amount<=0){errEl.textContent='Amount must be greater than 0';errEl.style.display='block';return;}
  try{
    const res=await fetch('/debt/api/borrowed',{method:'POST',headers:JSON_HEADERS,body:JSON.stringify({source_name:source,is_savings:loanIsSavings,amount,note:note||null,borrowed_at:date||null})});
    if(!res.ok)throw new Error('loan save failed: '+res.status);
  }catch(err){saveError=true;console.error('Failed to save loan',err);}
  closeModal();
  await refreshBorrowed();renderAll();
}

function setView(v){view=v;editDraft={};renderAll();}
function changeMonth(dir){const months=getSim();selectedMonth=Math.max(1,Math.min(months.length,selectedMonth+dir));renderAll();}

// Dragging the slider fires per notch — update the label instantly but put
// the full re-render (sim + whole-tab innerHTML rebuild) behind a short
// trailing debounce so a drag isn't dozens of rebuilds.
let renderTimer=null;
function scheduleRender(){clearTimeout(renderTimer);renderTimer=setTimeout(renderAll,80);}
document.getElementById('budgetSlider').addEventListener('input',e=>{
  budget=parseInt(e.target.value);
  document.getElementById('budgetLabel').textContent=fmt(budget);
  persist('settings');
  scheduleRender();
});

// Keeps the app current on its own: a cycle that rolled over server-side, or
// an edit made on another device, appears when you come back to the tab
// instead of after a manual reload. Held off whenever there is local work a
// reload would throw away — unsaved changes, a save still in flight, an open
// modal, or a half-typed row in Edit Debts.
const REFRESH_MIN_GAP_MS=60*1000;
const REFRESH_POLL_MS=5*60*1000;
let lastRefreshAt=Date.now();
function refreshBlocked(){
  return !loadedFromServer
    || Object.values(dirty).some(Boolean)
    || persistInFlight>0
    || document.getElementById('modalRoot').innerHTML!==''
    || Object.keys(editDraft).length>0;
}
async function refreshIfStale(){
  if(refreshBlocked())return;
  if(Date.now()-lastRefreshAt<REFRESH_MIN_GAP_MS)return;
  lastRefreshAt=Date.now();
  await loadState(); // renders
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshIfStale();});
window.addEventListener('focus',()=>refreshIfStale());
setInterval(()=>{if(document.visibilityState==='visible')refreshIfStale();},REFRESH_POLL_MS);

loadState();
initPush();
</script>
