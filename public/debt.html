<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  .field-input{background:#0f1117;border:1px solid #3a3d52;border-radius:6px;color:#e8e8ec;font-size:13px;padding:6px 8px;width:100%}
  .milestone-line{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
  .milestone-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
  .connector{width:2px;height:24px;background:#2a2d3e;margin-top:4px}

  .btn-primary{padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:700;background:#5b8def;color:#fff}
  .btn-ghost{padding:12px 16px;border-radius:8px;border:1px solid #3a3d52;font-size:13px;font-weight:600;background:#1a1d2e;color:#7c7f96}
  .check{width:26px;height:26px;border-radius:7px;border:2px solid #3a3d52;background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#7db87d;transition:all .15s}
  .check.done{background:#1a3a1a;border-color:#2a4a2a}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
  .modal{background:#1a1d2e;border-top:1px solid #2a2d3e;border-radius:18px 18px 0 0;padding:24px 20px max(24px,env(safe-area-inset-bottom,24px));width:100%;max-width:740px}
  .pot-big{font-size:44px;font-weight:800;letter-spacing:-1px}
  .log-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #2a2d3e;font-size:13px}

<body>

<div class="header">
  <div class="inner">
    <div style="font-size:10px;letter-spacing:.15em;color:#7c7f96;text-transform:uppercase;margin-bottom:4px">Debt Snowball · Arrears First</div>
    <h1 style="font-size:24px;font-weight:700;color:#fff;letter-spacing:-.5px">Nicky's Payoff Plan</h1>
    <div style="font-size:12px;color:#7c7f96;margin-top:2px">Starting July 2026</div>
    <div class="stat-grid" id="statGrid"></div>
    <div style="margin-top:16px">
      <label class="slider-label">Monthly debt target: <strong id="budgetLabel" style="color:#fff"></strong> <span style="color:#555">· drives the payoff plan</span></label>
      <input type="range" min="1500" max="3500" step="50" id="budgetSlider" style="width:100%;accent-color:#5b8def">

<script>
const COLORS=["#e05c5c","#e0923b","#d4bc17","#7db87d","#4a9fd4","#7b6fcf","#c466a1","#5bbfb0","#8c9b6e","#6e8c9b","#b07d5c","#9b6e8c"];
// floorPayment mirrors the SQL backfill in db/setup-debt.sql: the
// contractual minimum doubles as the starting floor, and stays null where
// there is no minimum to copy (Brewers' arrears-only trade account, HMRC
// pre-Time-to-Pay) — those need a floor agreed before they can have one.
const DEBTS_INITIAL=[
  {id:2, name:"Currys",       balance:965.72,   apr:39.9, min:25,     arrears:0,        due:15,   account:"personal", note:"Est. figures", floorPayment:25},
  {id:3, name:"Natwest CC",   balance:1111.90,  apr:26.9, min:40.03,  arrears:0,        due:10,   account:"personal", note:"", floorPayment:40.03},
  {id:4, name:"PayPal",       balance:2017.25,  apr:0,    min:93.44,  arrears:0,        due:11,   account:"personal", note:"0% interest", floorPayment:93.44},
  {id:5, name:"Brewers",      balance:2200.89,  apr:0,    min:0,      arrears:2200.89,  due:1,    account:"business", note:"Trade account — full balance in arrears", floorPayment:null},
  {id:6, name:"Amex",         balance:4065.64,  apr:30.4, min:205,    arrears:65.64,    due:28,   account:"business", note:"", floorPayment:205},
  {id:7, name:"Updraft",      balance:3583.81,  apr:17.9, min:264.66, arrears:793.98,   due:20,   account:"personal", note:"", floorPayment:264.66},
  {id:8, name:"Bounce Back",  balance:7733.65,  apr:2.5,  min:182.08, arrears:177.48,   due:14,   account:"business", note:"", floorPayment:182.08},
  {id:9, name:"NatWest Loan", balance:17122.68, apr:19,   min:520.01, arrears:2662.97,  due:15,   account:"personal", note:"", floorPayment:520.01},
  {id:10,name:"Van",          balance:20600,    apr:0,    min:400,    arrears:0,        due:null, account:"business", note:"Family loan — low priority", floorPayment:400},
  {id:11,name:"HMRC",         balance:31510.32, apr:0,    min:0,      arrears:0,        due:null, account:"business", note:"Needs Time to Pay arrangement", floorPayment:null},
];

// ---------- State ----------
let debts=[]; // live debts only — archived ones live in archivedDebts
let archivedDebts=[]; // hidden from the plan/views, kept because history references their ids
let archivedExpanded=false;
let budget=2000;
let sweepPct=50;
let bizPot=0;
let perPot=0;
let savingsPot=0;
let savingsPct=10;
// Floor & target payments. bufferPot is a cash cushion filled BEFORE any
// debt allocation; bufferTarget 0 means the buffer is switched off, which is
// the default — it moves real money, so it's opted into, not assumed.
let bufferPot=0;
let bufferTarget=0;
// Running "behind on floors" ledger: [{id,name,amount,since}], one entry per
// debt, written when a cycle closes with a floor unmet. Deliberately inert —
// nothing reads it back into the plan until the user taps Catch up.
let floorShortfalls=[];
let incomeLog=[]; // {id, amount, bizAmt, perAmt, savedAmt, bufferAmt, date}
let paidThisCycle=[]; // array of debt ids paid
let missedThisCycle=[]; // debt ids deliberately skipped this cycle — mutually exclusive with paidThisCycle
// Debt ids where the FLOOR was paid but the target wasn't — the third state a
// payment can be in, and the only reason the two verdicts can differ. All
// three lists are mutually exclusive; setPaymentState() is the one place
// that moves an id between them.
let floorPaidThisCycle=[];
let history=[]; // completed cycles, newest first — from debt_plan_cycle_history
let view='cashflow';
let tightThreshold=600;
let lastMilestone='';
let selectedMonth=1;
let editDraft={};
let notifyDaysBefore=3;
let notificationsEnabled=true;
let notifyTestStatus='';
// Web Push to THIS device (the installed PWA), alongside the server-wide
// ntfy transport. States: init (still checking) | unsupported |
// need-install (iOS Safari tab — push only works from the Home Screen app)
// | off | on | busy | denied (blocked in system settings).
let pushState='init';
let swRegistration=null;
// Last-known updated_at per table, echoed back on writes so the server can
// detect a stale save from another device (409) instead of overwriting.
let debtsUpdatedAt=null;
let settingsUpdatedAt=null;
let cashflowUpdatedAt=null;
let conflictBanner='';
let cycleStatus={daysSinceStart:0,promptReset:false};
let cycleResetDismissed=false;
let borrowedActive=[]; // loaded from GET /debt/api/borrowed on init
let borrowedRepaid=[];
let repaidLogExpanded=false;
let loanIsSavings=false;
// Guards against the seed-overwrite trap (efficiency review finding 1):
// until the server state has actually loaded, saving stays off so a slider
// touch can't push DEBTS_INITIAL over the real balances.
let loadedFromServer=false;
let loadFailed=false;
// Offline read-only mode: when /api/state is unreachable but a snapshot of
// the last synced load exists in localStorage, the app renders that data
// instead of the seed placeholders. Timestamp of the snapshot, or null.
const STATE_CACHE_KEY='debtPlanOfflineCache';
let offlineCachedAt=null;
// Set when a save fails (network or 5xx) — surfaced as a banner instead of
// dying silently in the console; the dirty flags retry on the next save.
let saveError=false;

const JSON_HEADERS={'Content-Type':'application/json'};
let persistTimer=null;
// Which collections have local changes the server hasn't seen. Saving only
// what changed keeps a settings tweak from rewriting the debt rows too —
// call persist('settings') etc.; a bare persist() marks everything (safe
// fallback for anything missed).
const dirty={debts:false,settings:false,cashflow:false};
function persist(...kinds){
  (kinds.length?kinds:['debts','settings','cashflow']).forEach(k=>dirty[k]=true);
  clearTimeout(persistTimer);
  persistTimer=setTimeout(persistNow,400);
}
const PERSIST_BODIES={
  debts:()=>({debts,clientUpdatedAt:debtsUpdatedAt}),
  settings:()=>({budget,sweepPct,savingsPct,tightThreshold,lastMilestone,notifyDaysBefore,notificationsEnabled,bufferTarget,clientUpdatedAt:settingsUpdatedAt}),
  cashflow:()=>({bizPot,perPot,savingsPot,bufferPot,paidThisCycle,missedThisCycle,floorPaidThisCycle,floorShortfalls,clientUpdatedAt:cashflowUpdatedAt})
};
async function persistNow(){
  if(!loadedFromServer)return; // never push the fallback seed over real data
  const kinds=Object.keys(dirty).filter(k=>dirty[k]);
  if(!kinds.length)return;
  kinds.forEach(k=>dirty[k]=false);
  try{
    const results=await Promise.all(kinds.map(k=>
      fetch('/debt/api/'+k,{method:'POST',headers:JSON_HEADERS,body:JSON.stringify(PERSIST_BODIES[k]())})));
    let failed=false;
    for(let i=0;i<results.length;i++){
      if(!results[i].ok&&results[i].status!==409){dirty[kinds[i]]=true;failed=true;continue;}
      await handleWriteResponse(results[i],kinds[i]);
    }
    if(failed!==saveError){saveError=failed;renderAll();}
  }catch(err){
    kinds.forEach(k=>dirty[k]=true); // retried with the next save
    if(!saveError){saveError=true;renderAll();}
    console.error('Failed to save debt plan state',err);
  }
}
// Applies a write's outcome: on 409, another device saved more recently, so
// hydrate from the fresh copy the server sends back instead of overwriting
// it, and surface the conflict banner. Otherwise just track the new
// updated_at so the next save can be compared correctly.
async function handleWriteResponse(res,kind){
  if(res.status===409){
    const body=await res.json().catch(()=>null);
    if(!body)return;
    if(kind==='debts'){debts=body.current;debtsUpdatedAt=body.updatedAt;}
    else if(kind==='settings'){
      budget=body.current.budget;sweepPct=body.current.sweepPct;savingsPct=body.current.savingsPct;
      tightThreshold=body.current.tightThreshold;lastMilestone=body.current.lastMilestone;
      notifyDaysBefore=body.current.notifyDaysBefore;notificationsEnabled=body.current.notificationsEnabled;
      bufferTarget=body.current.bufferTarget??0;
      settingsUpdatedAt=body.updatedAt;
    }else if(kind==='cashflow'){
      bizPot=body.current.bizPot;perPot=body.current.perPot;savingsPot=body.current.savingsPot;
      bufferPot=body.current.bufferPot??0;
      paidThisCycle=body.current.paidThisCycle;missedThisCycle=body.current.missedThisCycle||[];
      floorPaidThisCycle=body.current.floorPaidThisCycle||[];
      floorShortfalls=body.current.floorShortfalls||[];
      cashflowUpdatedAt=body.updatedAt;
    }
    conflictBanner="Updated on another device — your changes weren't saved. Refreshed to latest.";
    renderAll();
    return;
  }
  if(!res.ok)return;
  const body=await res.json().catch(()=>null);
  if(!body)return;
  if(kind==='debts')debtsUpdatedAt=body.updatedAt;
  else if(kind==='settings')settingsUpdatedAt=body.updatedAt;
  else if(kind==='cashflow')cashflowUpdatedAt=body.updatedAt;
}
function applyStatePayload(s){
  debts=s.debts;
  archivedDebts=s.archivedDebts||[]; // ||[] — pre-feature offline snapshots lack it
  budget=s.settings.budget;
  sweepPct=s.settings.sweepPct;
  savingsPct=s.settings.savingsPct;
  tightThreshold=s.settings.tightThreshold;
  lastMilestone=s.settings.lastMilestone;
  notifyDaysBefore=s.settings.notifyDaysBefore??3;
  notificationsEnabled=s.settings.notificationsEnabled??true;
  bufferTarget=s.settings.bufferTarget??0; // ??0 — pre-feature offline snapshots lack it
  bizPot=s.cashflow.bizPot;
  perPot=s.cashflow.perPot;
  savingsPot=s.cashflow.savingsPot;
  bufferPot=s.cashflow.bufferPot??0;
  paidThisCycle=s.cashflow.paidThisCycle;
  missedThisCycle=s.cashflow.missedThisCycle||[]; // ||[] — pre-feature offline snapshots lack it
  floorPaidThisCycle=s.cashflow.floorPaidThisCycle||[];
  floorShortfalls=s.cashflow.floorShortfalls||[];
  incomeLog=s.incomeLog;
  debtsUpdatedAt=s.meta?.debtsUpdatedAt||null;
  settingsUpdatedAt=s.meta?.settingsUpdatedAt||null;
  cashflowUpdatedAt=s.meta?.cashflowUpdatedAt||null;
}
async function loadState(){
  let statePayload=null;
  const stateLoad=(async()=>{
    const res=await fetch('/debt/api/state');
    if(!res.ok)throw new Error('state load failed: '+res.status);
    const s=await res.json();
    applyStatePayload(s);
    statePayload=s;
    loadedFromServer=true;
  })().catch(err=>{
    console.error('Failed to load debt plan state, using defaults',err);
    debts=DEBTS_INITIAL.map(d=>({...d}));
    loadFailed=true; // read-only: persistNow() refuses until a real load
  });
  // These endpoints are independent of /api/state and each other — fetch
  // them alongside it instead of one after another (was 4 serialized round
  // trips before first paint).
  await Promise.all([stateLoad,refreshHistory(),refreshCycleStatus(),refreshBorrowed()]);
  if(loadedFromServer){
    // Snapshot everything the tabs render, for the offline read-only view.
    try{
      localStorage.setItem(STATE_CACHE_KEY,JSON.stringify({
        state:statePayload,history,borrowedActive,borrowedRepaid,cycleStatus,cachedAt:Date.now()
      }));
    }catch(err){/* quota/private mode — offline view just stays unavailable */}
  }else{
    // No server: fall back to the last synced snapshot, still read-only
    // (loadedFromServer stays false, so persistNow()/startNewCycle refuse).
    try{
      const cached=JSON.parse(localStorage.getItem(STATE_CACHE_KEY)||'null');
      if(cached&&cached.state){
        applyStatePayload(cached.state);
        history=cached.history||[];
        borrowedActive=cached.borrowedActive||[];
        borrowedRepaid=cached.borrowedRepaid||[];
        cycleStatus=cached.cycleStatus||cycleStatus;
        offlineCachedAt=cached.cachedAt||null;
        loadFailed=false; // real (if stale) data — show the offline banner instead
      }
    }catch(err){console.error('Offline snapshot unreadable',err);}
  }
  renderAll();
}
async function refreshHistory(){
  try{
    const res=await fetch('/debt/api/history');
    history=await res.json();
  }catch(err){console.error('Failed to load cycle history',err);}
}
async function refreshCycleStatus(){
  try{
    const res=await fetch('/debt/api/cycle-status');
    cycleStatus=await res.json();
  }catch(err){console.error('Failed to load cycle status',err);}
}
// Borrowed money tab — fully standalone from the rest of the app's state.
// See Debt Management App/debt-app-borrowed-money.md.
async function refreshBorrowed(){
  try{
    const res=await fetch('/debt/api/borrowed');
    const data=await res.json();
    borrowedActive=data.active||[];
    borrowedRepaid=data.repaid||[];
  }catch(err){console.error('Failed to load borrowed money data',err);}
}
// cycle_history.notes is JSON written by POST /debt/api/new-cycle. Cycles
// closed before the floors feature have no notes, or notes carrying only
// {missed:[...]} — both parse to an object with no verdict, and render
// without the badges.
function parseCycleNotes(notes){
  if(!notes)return {};
  try{const o=JSON.parse(notes);return o&&typeof o==='object'?o:{};}
  catch(err){return {};}
}
function renderCycleVerdict(notes){
  if(typeof notes.floorsMet!=='boolean'&&typeof notes.targetMet!=='boolean')return '';
  const badge=(ok,label)=>`<span class="badge" style="background:${ok?'#1a3a1a':'#2a1a0a'};color:${ok?'#7db87d':'#e0923b'}">${ok?'✅':'⚠'} ${label}</span>`;
  const shortfalls=Array.isArray(notes.floorShortfalls)?notes.floorShortfalls:[];
  const shortTotal=shortfalls.reduce((s,f)=>s+(Number(f.amount)||0),0);
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
    ${typeof notes.floorsMet==='boolean'?badge(notes.floorsMet,'Floors'):''}
    ${typeof notes.targetMet==='boolean'?badge(notes.targetMet,'Target'):''}
  </div>${shortTotal>0.005?`<div style="font-size:11px;color:#e0923b;margin-bottom:8px">${fmt(shortTotal)} short on ${shortfalls.length} floor${shortfalls.length===1?'':'s'} — ${shortfalls.map(f=>esc(f.name)).join(', ')}</div>`:''}`;
}
function formatBorrowedDate(d){
  if(!d)return '—';
  return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}
// Snapshot of what this cycle actually paid, for archiving to history.
// Read before debts/paidThisCycle/incomeLog are cleared for the new cycle.
function getCycleArchivePayload(){
  const cyclePayments=getCyclePayments();
  // Floor-only payments belong in the archive too, at the amount that
  // actually left the pot — otherwise a floors-met cycle reads as £0 paid.
  const debtsPaid=cyclePayments
    .filter(p=>paidThisCycle.includes(p.id)||p.floorPaid)
    .map(p=>({id:p.id,name:p.name,amount:paidThisCycle.includes(p.id)?p.amount:(p.floorDue||0)}));
  // Only ids that are genuinely among this cycle's payments — a stale missed
  // id (debt since cleared/edited away) shouldn't reach the history note.
  const debtsMissed=missedThisCycle.filter(id=>cyclePayments.some(p=>p.id===id));
  // Floors that weren't met this cycle become ledger entries — recorded per
  // debt, visible, and inert until the user chooses to catch up. Deliberately
  // NOT added to next cycle's required payment: automatic compounding is the
  // pressure this whole feature exists to remove.
  const fs=getFloorStatus();
  const cycleFloorShortfalls=fs.unmet.map(p=>({id:p.id,name:p.name,amount:round2(p.floorDue)}));
  const since=new Date().toLocaleDateString('en-GB',{month:'short',year:'numeric'});
  const merged=floorShortfalls.map(f=>({...f}));
  for(const nf of cycleFloorShortfalls){
    const existing=merged.find(m=>m.id===nf.id);
    if(existing){existing.amount=round2(existing.amount+nf.amount);existing.name=nf.name;}
    else merged.push({...nf,since});
  }
  return {debtsPaid,debtsMissed,bizPotClose:bizPot,perPotClose:perPot,
    floorShortfalls:merged,cycleFloorShortfalls,floorsMet:fs.floorsMet,targetMet:fs.targetMet};
}

// For free text (notes, loan sources) interpolated into innerHTML/attribute
// values — a note containing " or < would otherwise break the markup.

const fmt=(n)=>'£'+Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtS=(n)=>'£'+Math.round(Math.abs(n)).toLocaleString('en-GB');
const parseNum=(s)=>{const n=parseFloat(String(s).replace(/[^0-9.]/g,''));return isNaN(n)?0:n;};
const round2=(n)=>Math.round((Number(n)||0)*100)/100;

function getMonthLabel(m,short=false){
  const d=new Date(2026,6,1);d.setMonth(d.getMonth()+m-1);
  return short?d.toLocaleString('en-GB',{month:'short',year:'2-digit'}):d.toLocaleString('en-GB',{month:'long',year:'numeric'});
}

function simulate(dts,bdgt){
  let state=dts.map(d=>({...d,remainingArrears:d.arrears,remaining:d.balance}));
  const months=[];
  for(let month=1;month<=360;month++){
    let bl=bdgt;const payments=[];
    for(let d of state){
      if(d.remaining<=0.005){payments.push({id:d.id,name:d.name,minPaid:0,arrearsPaid:0,extra:0,total:0,remaining:0,remainingArrears:0,cleared:true,wasActive:false});continue;}
      const interest=(d.apr/100/12)*d.remaining;d.remaining+=interest;
      const minPaid=Math.min(d.min,d.remaining);d.remaining=Math.max(0,d.remaining-minPaid);bl-=minPaid;
      payments.push({id:d.id,name:d.name,minPaid,arrearsPaid:0,extra:0,total:minPaid,remaining:d.remaining,remainingArrears:d.remainingArrears,cleared:false,wasActive:true});
    }
    const arrearsDebts=state.filter(d=>d.remainingArrears>0.005&&d.remaining>0.005);
    const inArrears=arrearsDebts.length>0;
    if(inArrears&&bl>0.005){
      // Highest arrears first — pour the whole leftover budget into the worst one,
      // then roll any remainder onto the next, and so on down the list.
      const ordered=arrearsDebts.slice().sort((a,b)=>b.remainingArrears-a.remainingArrears);
      let remaining=bl;
      for(let d of ordered){
        if(remaining<=0.005)break;
        const pay=Math.min(remaining,d.remainingArrears,d.remaining);
        d.remainingArrears=Math.max(0,d.remainingArrears-pay);d.remaining=Math.max(0,d.remaining-pay);remaining-=pay;
        const pi=payments.findIndex(p=>p.id===d.id);
        payments[pi].arrearsPaid=pay;payments[pi].total+=pay;payments[pi].remaining=d.remaining;payments[pi].remainingArrears=d.remainingArrears;
        if(d.remaining<=0.005)payments[pi].cleared=true;
      }
      bl=remaining;
    }else if(!inArrears&&bl>0.005){
      const target=state.find(d=>d.remaining>0.005);
      if(target){const extra=Math.min(bl,target.remaining);target.remaining=Math.max(0,target.remaining-extra);bl-=extra;
        const pi=payments.findIndex(p=>p.id===target.id);
        payments[pi].extra=extra;payments[pi].total+=extra;payments[pi].remaining=target.remaining;
        if(target.remaining<=0.005)payments[pi].cleared=true;}
    }
    months.push({month,payments,totalOut:bdgt-bl,budgetLeft:bl,phase:inArrears?'arrears':'snowball'});
    if(state.every(d=>d.remaining<=0.005))break;
  }
  return months;
}

// Memoized simulate(debts,budget). Every real change replaces `debts` by
// reference (debts=debts.map(...) / =body.current / =s.debts), so reference
// equality is a correct cache key — renderAll, getCyclePayments and the
// what-if baselines were each re-running the full 360-month sim per render.
let simCache={debts:null,budget:null,months:null};
function getSim(){
  if(simCache.debts!==debts||simCache.budget!==budget){
    simCache={debts,budget,months:simulate(debts,budget)};
  }
  return simCache.months;
}

function getMilestones(months){const m={};for(const mo of months)for(const p of mo.payments)if(p.cleared&&p.wasActive&&!m[p.id])m[p.id]=mo.month;return m;}

// Build the "this cycle" payment list from month 1 of the sim
function getCurrentTarget(){
  // Mirrors the simulate() priority: clear arrears first (HIGHEST arrears first),
  // otherwise snowball the smallest remaining balance. Excludes zero balances
  // and any debt with no minimum payment AND no due date — i.e. nothing in
  // the payment plan at all (HMRC pre-Time-to-Pay: min 0, due null; once an
  // arrangement sets a min/due it joins the plan by itself). Data-driven so
  // new debts behave sensibly — was a hardcoded `id !== 11`.
  const active=debts.filter(d=>d.balance>0.005 && (d.min>0.005||d.due));
  const arrearsDebts=active.filter(d=>d.arrears>0.005);
  if(arrearsDebts.length){
    // highest arrears first — matches simulate()'s payment order
    return arrearsDebts.slice().sort((a,b)=>b.arrears-a.arrears)[0];
  }
  // snowball: smallest balance overall
  return active.slice().sort((a,b)=>a.balance-b.balance)[0]||null;
}
function getCyclePayments(){
  const months=getSim();
  const m1=months[0];
  if(!m1)return [];
  return m1.payments.filter(p=>p.total>0.005).map(p=>{
    const debt=debts.find(d=>d.id===p.id);
    const floor=floorOf(debt);
    return {id:p.id,name:p.name,amount:p.total,due:debt?.due??99,arrears:p.arrearsPaid>0.005,snowball:p.extra>0.005,missed:missedThisCycle.includes(p.id),
      floorPaid:floorPaidThisCycle.includes(p.id),
      account:debt?.account||'personal',
      floor,
      // What must actually go out to keep the commitment. Capped at the
      // planned payment: once a balance is nearly cleared you can't (and
      // needn't) send more than is left.
      floorDue:floor===null?null:Math.min(floor,p.total)};
  }).sort((a,b)=>a.due-b.due);
}

// ---------- Floors & targets ----------
// Two numbers per debt: the TARGET (what the plan pays in an average month —
// the existing budget-driven figure) and the FLOOR (the minimum committed
// payment, sized to a worst-case income month, and the number creditors are
// held to). A cycle that meets every floor is on track even if it misses
// targets, which is the whole point: irregular income shouldn't turn one
// light month into a failed plan.
//
// null means "no floor agreed yet" and is NOT the same as a floor of £0 —
// an unset debt is left out of the floors verdict and flagged for the user
// to set, rather than being silently counted as a commitment of nothing.
function floorOf(d){
  const f=d&&d.floorPayment;
  if(f===null||f===undefined||f==='')return null;
  const n=Number(f);
  return isFinite(n)&&n>=0?n:null;
}
// Arrears first (highest arrears first, matching simulate()), then earliest
// due date — the order floors get funded in when income can't cover them all.
function floorPriority(a,b){
  const da=debts.find(x=>x.id===a.id),db_=debts.find(x=>x.id===b.id);
  const aa=da?.arrears||0,ba=db_?.arrears||0;
  if((aa>0.005)!==(ba>0.005))return aa>0.005?-1:1;
  if(Math.abs(aa-ba)>0.005)return ba-aa;
  return a.due-b.due;
}
// The cycle's standing on both numbers. Everything the Cash Flow view needs
// to say "floors met / target met" and how much is still uncovered.
function getFloorStatus(){
  const payments=getCyclePayments();
  let floorTotal=0,floorPaid=0,outstandingBiz=0,outstandingPer=0,noFloorSet=0;
  const unmet=[];
  for(const p of payments){
    if(p.floorDue===null){noFloorSet++;continue;}
    floorTotal+=p.floorDue;
    // Either route settles the floor: the target paid in full, or the floor
    // paid on its own.
    if(paidThisCycle.includes(p.id)||p.floorPaid){floorPaid+=p.floorDue;continue;}
    unmet.push(p);
    // A deliberately missed debt still counts as an unmet floor (that's the
    // signal worth having), but no money is set aside for it.
    if(!p.missed){
      if(p.account==='business')outstandingBiz+=p.floorDue; else outstandingPer+=p.floorDue;
    }
  }
  const withFloor=payments.filter(p=>p.floorDue!==null);
  const targetTotal=payments.filter(p=>!p.missed).reduce((s,p)=>s+p.amount,0);
  // What actually went out: full amount where the target was paid, the floor
  // where only that was.
  const targetPaid=payments.reduce((s,p)=>s+(paidThisCycle.includes(p.id)?p.amount:p.floorPaid?(p.floorDue||0):0),0);
  return {
    payments,unmet,noFloorSet,floorTotal,floorPaid,targetTotal,targetPaid,
    outstandingBiz,outstandingPer,
    // Money already in the pots against the floors still to pay.
    shortBy:Math.max(0,outstandingBiz-bizPot)+Math.max(0,outstandingPer-perPot),
    floorsMet:withFloor.length>0&&unmet.length===0,
    // Stricter than the surplus prompt's allDone: a deliberately missed debt
    // means the target wasn't hit, even though the floors verdict is what
    // decides whether the cycle counts as on track.
    targetMet:payments.length>0&&payments.every(p=>paidThisCycle.includes(p.id))
  };
}
// Where a pay-in goes, in the spec's order: buffer, then floors (arrears
// first), then savings, then whatever the ordinary sweep has left for
// targets, then living money. Floors come OUT OF the sweep rather than on
// top of it, so a month whose floors are already covered splits exactly as
// it did before this feature existed.
function allocateIncome(amt){
  const gross=Math.max(0,amt);
  const buffer=Math.min(gross,Math.max(0,bufferTarget-bufferPot));
  let rem=gross-buffer;
  // Pot balances count toward the floors before any new money does.
  let creditBiz=bizPot,creditPer=perPot,floorBiz=0,floorPer=0;
  for(const p of getFloorStatus().unmet.filter(x=>!x.missed).sort(floorPriority)){
    const isBiz=p.account==='business';
    const credit=isBiz?creditBiz:creditPer;
    const used=Math.min(credit,p.floorDue);
    if(isBiz)creditBiz-=used; else creditPer-=used;
    const gap=p.floorDue-used;
    if(gap<=0.005||rem<=0.005)continue;
    const add=Math.min(rem,gap);
    if(isBiz)floorBiz+=add; else floorPer+=add;
    rem-=add;
  }
  const savings=Math.min(rem,gross*savingsPct/100);
  rem-=savings;
  // Targets get the rest of the sweep — the floor money already spent counts
  // against it, so this is a top-up to target, not a second helping.
  const targetSweep=Math.max(0,Math.min(rem,gross*sweepPct/100-floorBiz-floorPer));
  const {businessTotal,personalTotal}=getCycleTotals();
  const needBiz=Math.max(0,businessTotal-bizPot-floorBiz);
  const needPer=Math.max(0,personalTotal-perPot-floorPer);
  let tBiz;
  if(needBiz+needPer>0.005)tBiz=targetSweep*needBiz/(needBiz+needPer);
  else if(businessTotal+personalTotal>0.005)tBiz=targetSweep*businessTotal/(businessTotal+personalTotal);
  else tBiz=targetSweep/2;
  const tPer=targetSweep-tBiz;
  rem-=targetSweep;
  return {buffer,biz:floorBiz+tBiz,per:floorPer+tPer,savings,keep:Math.max(0,rem),
    floorBiz,floorPer,floorFunded:floorBiz+floorPer,targetSweep};
}

      html+=`<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#555;margin-bottom:4px">
          <span>${pctCleared}% of total debt cleared</span>
          <span>${fmt(totalPaid)} paid off</span>
        </div>
        <div style="background:#2a2d3e;border-radius:6px;height:5px;overflow:hidden">
          <div style="width:${pctCleared}%;height:100%;background:linear-gradient(90deg,#5b8def,#7db87d);border-radius:6px;transition:width .4s"></div>
        </div>
      </div>`;
    }

    // Surplus prompt — all (non-missed) payments done AND money left in pot
    const allDone = activeCycle.length>0 && activeCycle.every(p=>paidThisCycle.includes(p.id));
    const targetForSurplus=getCurrentTarget();
    const surplus = targetForSurplus?.account==='business'?bizPot:perPot;
    if(allDone && surplus>0.005){
      const target=getCurrentTarget();
      if(target){
        const isArr=target.arrears>0.005;
        html+=`<div class="card card-green" style="border-radius:12px">
          <div style="font-size:11px;color:#7db87d;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Surplus in pot — put it to work</div>
          <div style="font-size:13px;color:#e8e8ec;line-height:1.5;margin-bottom:12px">
            All bills are paid and you've got <strong style="color:#7db87d">${fmt(surplus)}</strong> left over. Sending it to your current target clears debt faster and shaves time off the plan.
          </div>
          <div style="background:#0f1117;border-radius:8px;padding:10px 12px;margin-bottom:12px">
            <div class="row">
              <div>
                <div style="font-weight:600;font-size:15px">${esc(target.name)} ${isArr?'<span class="badge badge-red">ARREARS</span>':'<span class="badge badge-blue">SNOWBALL TARGET</span>'}</div>
                <div style="font-size:12px;color:#7c7f96;margin-top:2px">Current balance ${fmt(target.balance)}</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:11px;color:#7c7f96">After payment</div>
                <div style="font-weight:700;color:#7db87d">${fmt(Math.max(0,target.balance-surplus))}</div>

            </div>
          </div>
          <button class="btn-primary" style="width:100%;background:#7db87d" onclick="applySurplus()">Send ${fmt(surplus)} to ${esc(target.name)}</button>
        </div>`;
      }
    }

    // Cycle-reset nudge — same 28-day check as the daily push notification,
    // shown once per page load (dismissing doesn't persist server-side).
    if(cycleStatus.promptReset && !cycleResetDismissed){
      html+=`<div class="card" style="border:1px solid #6a5a1a;background:#1a1608;border-radius:10px;margin-bottom:8px">
        <div class="row" style="align-items:flex-start">
          <div style="font-size:13px;color:#e0c060">📅 Your cycle is ${cycleStatus.daysSinceStart} days old — ready to start a new one?</div>

        </div>
        <button class="btn-ghost" style="width:100%;margin-top:10px" onclick="startNewCycle()">Start new cycle</button>
      </div>`;
    }

    html+=renderBehindPanel();

    // Progress bar of cycle
    const cycleTotal2=bizCycleTotal+perCycleTotal;
    const paidTotal2=paidBizTotal+paidPerTotal;
    const pctPaid=cycleTotal2>0?Math.round((paidTotal2/cycleTotal2)*100):0;
    html+=`<div class="card">
      <div class="row" style="margin-bottom:8px">
        <h2 style="margin:0">This cycle's payments</h2>
        <span style="font-size:12px;color:#7c7f96">${activeCycle.filter(p=>paidThisCycle.includes(p.id)).length}/${activeCycle.length} done · ${fmt(paidTotal2)} paid${activeCycle.filter(p=>p.floorPaid).length?` · <span style="color:#7db87d">${activeCycle.filter(p=>p.floorPaid).length} at floor</span>`:''}${missedCount?` · <span style="color:#e0923b">${missedCount} missed</span>`:''}</span>
      </div>
      ${renderFloorIndicators(fs)}
      <div style="background:#0f1117;border-radius:6px;height:6px;overflow:hidden;margin-bottom:14px">
        <div style="width:${pctPaid}%;height:100%;background:#7db87d;border-radius:6px;transition:width .3s"></div>
      </div>`;
    if(nextDue){
      html+=`<div class="card-blue" style="border-radius:8px;padding:10px 12px;margin-bottom:12px;border:1px solid #2a3a5e">
        <div style="font-size:11px;color:#5b8def;text-transform:uppercase;letter-spacing:.06em">Next to pay</div>
        <div class="row" style="margin-top:4px">
          <div><span style="font-weight:600;font-size:15px">${esc(nextDue.name)}</span> <span style="font-size:12px;color:#7c7f96">· due ${nextDue.due<99?ord(nextDue.due):'flexible'}</span></div>
          <div style="font-weight:700;color:#5b8def">${fmt(nextDue.amount)}</div>
        </div>
      </div>`;
    }
    cyclePayments.forEach((p,i)=>{
      const state=paymentState(p.id);
      const done=state==='paid';
      const floorOnly=state==='floor';
      const missed=state==='missed';
      const debt=debts.find(d=>d.id===p.id);
      // "Paid the floor" is only a distinct choice when the floor is actually
      // less than the target — otherwise paying the floor IS paying in full.
      const floorIsLess=p.floorDue!==null&&p.floorDue<p.amount-0.005;
      const link=(fn,label,color)=>`<button onclick="${fn}(${p.id})" style="background:none;border:none;padding:2px 0 0;font-size:10px;font-weight:600;color:${color};text-decoration:underline">${label}</button>`;
      html+=`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;${i<cyclePayments.length-1?'border-bottom:1px solid #2a2d3e':''}">
        <button class="check ${done?'done':''}" onclick="togglePaid(${p.id})" style="${missed?'opacity:.35':''}${floorOnly?'border-color:#7db87d;color:#7db87d':''}">${done?'✓':floorOnly?'◐':''}</button>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span style="font-weight:600;${done?'color:#555;text-decoration:line-through':missed?'color:#7c7f96':''}">${esc(p.name)}</span>
            ${debt?.account==='business'?'<span class="badge" style="background:#2a1a0a;color:#e0923b">BIZ</span>':'<span class="badge" style="background:#0a1228;color:#5b8def">PER</span>'}
            ${missed?'<span class="badge" style="background:#3a2a0a;color:#e0923b">MISSED</span>':''}
            ${floorOnly?'<span class="badge badge-green">FLOOR PAID</span>':''}
            ${p.arrears&&!done&&!missed&&!floorOnly?'<span class="badge badge-red">ARREARS</span>':''}

          </div>
          <div style="font-size:11px;color:#555;margin-top:1px">${missed?'Skipped this cycle — no budget set aside':floorOnly?`Floor met · ${fmt(p.amount-p.floorDue)} under target`:(p.due<99?'Due '+ord(p.due):'Flexible date')}${p.floorDue!==null&&!floorOnly?` · floor <span style="color:${done?'#555':missed?'#e0923b':'#7c7f96'}">${fmt(p.floorDue)}</span>`:''}${p.floorDue===null?' · <span style="color:#e0923b">no floor set</span>':''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-weight:700;color:${done||missed?'#555':floorOnly?'#7db87d':'#e8e8ec'};${done||missed?'text-decoration:line-through':''}">${floorOnly?fmt(p.floorDue):fmt(p.amount)}</div>
          ${done?'':`<div style="display:flex;gap:8px;justify-content:flex-end">
            ${floorIsLess||floorOnly?link('togglePaidFloor',floorOnly?'undo floor':'paid floor only','#7db87d'):''}
            ${floorOnly?'':link('toggleMissed',missed?'undo missed':'missed this cycle?',missed?'#e0923b':'#555')}
          </div>`}
        </div>
      </div>`;
    });
    html+=`<div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn-ghost" style="flex:1" onclick="startNewCycle()">Start new cycle</button>
    </div></div>`;

    // HMRC reminder
    const hmrc=debts.find(d=>d.id===11);
    html+=`<div class="card card-yellow">
      <div class="row"><div><div style="font-weight:600">HMRC — ${fmt(hmrc?.balance??0)}</div>
      <div style="font-size:12px;color:#b5b07c;margin-top:2px">Call 0300 200 3835 to set up Time to Pay</div></div></div>
    </div>`;

    // Income log
    if(incomeLog.length){
      html+=`<div class="card"><h2>Money in this cycle</h2>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:#7c7f96">
          <span>In: <strong style="color:#e8e8ec">${fmt(totalIn)}</strong></span>
          <span>Biz pot: <strong style="color:#e0923b">${fmt(incomeLog.reduce((s,e)=>s+(e.bizAmt||0),0))}</strong></span>
          <span>Per pot: <strong style="color:#5b8def">${fmt(incomeLog.reduce((s,e)=>s+(e.perAmt||0),0))}</strong></span>
        </div>`;
      incomeLog.slice().reverse().forEach((e,ri)=>{
        const realIdx=incomeLog.length-1-ri;
        html+=`<div class="log-item">
          <span style="color:#7c7f96">${e.date}</span>
          <span style="font-size:12px">In: <strong>${fmt(e.amount)}</strong> · Biz: <strong style="color:#e0923b">${fmt(e.bizAmt||0)}</strong> · Per: <strong style="color:#5b8def">${fmt(e.perAmt||0)}</strong>${e.savedAmt>0?` · Saved: <strong style="color:#7db87d">${fmt(e.savedAmt)}</strong>`:''}${e.bufferAmt>0?` · Buffer: <strong style="color:#7db87d">${fmt(e.bufferAmt)}</strong>`:''}</span>
          <button onclick="deleteIncome(${realIdx})" style="background:none;border:none;color:#e05c5c;font-size:16px;padding:0 4px">×</button>
        </div>`;
      });
      html+=`</div>`;
    }

    // ── Tight week triage ──
    const cycleIncome=incomeLog.reduce((s,e)=>s+e.amount,0);
    if(cycleIncome>0 && cycleIncome<tightThreshold*4.33){
      // This cycle looks tight - show triage
      const today=new Date().getDate();
      const unpaid=cyclePayments.filter(p=>!paidThisCycle.includes(p.id)&&!p.missed&&!p.floorPaid);
      const withPriority=unpaid.map(p=>{
        const debt=debts.find(d=>d.id===p.id);
        const daysUntilDue=debt?.due?((debt.due-today+31)%31):30;
        const inArrears=p.arrears;
        const isHighAPR=(debt?.apr||0)>25;
        const isTrade=debt?.account==='business'&&(debt?.min===0||!debt?.due);
        // Priority scoring
        let priority,color,bg,advice;
        if(inArrears&&daysUntilDue<=7){
          priority='MUST PAY';color='#e05c5c';bg='#3a0d0d';
          advice='Already in arrears — missing this risks default';
        } else if(inArrears||daysUntilDue<=5){
          priority='MUST PAY';color='#e05c5c';bg='#3a0d0d';
          advice=inArrears?'In arrears — pay what you can':'Due very soon';
        } else if(daysUntilDue<=10||isHighAPR){
          priority='PAY SOON';color='#e0923b';bg='#2a1a0a';
          advice=daysUntilDue<=10?`Due in ~${daysUntilDue} days`:'High interest — pay before it grows';
        } else {
          priority='CAN WAIT';color='#7db87d';bg='#0d1a0d';
          advice=isTrade?'Trade account — contact if needed':`Due ${debt?.due?ord(debt.due):'flexibly'} — some breathing room`;
        }
        return {...p,priority,color,bg,advice,daysUntilDue,debt};
      }).sort((a,b)=>{
        const order={'MUST PAY':0,'PAY SOON':1,'CAN WAIT':2};
        return order[a.priority]-order[b.priority]||a.daysUntilDue-b.daysUntilDue;
      });

      html+=`<div class="card" style="border:1px solid #6a3a1a;background:#1a0f08;border-radius:12px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
          <span style="font-size:18px">⚠</span>
          <div>
            <div style="font-size:14px;font-weight:700;color:#e0923b">Tight week mode</div>
            <div style="font-size:12px;color:#7c7f96">Income logged (${fmt(cycleIncome)}) looks light — here's what to prioritise</div>
          </div>
        </div>`;
      withPriority.forEach(p=>{
        html+=`<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #2a1a0a">
          <div style="background:${p.bg};border:1px solid ${p.color}33;border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px">
            <div style="font-size:9px;font-weight:700;color:${p.color};letter-spacing:.06em;white-space:nowrap">${p.priority}</div>
          </div>
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <span style="font-weight:600;font-size:14px">${esc(p.name)}</span>
              <span style="font-weight:700;color:${p.color};flex-shrink:0;margin-left:8px">${fmt(p.amount)}</span>
            </div>
            <div style="font-size:12px;color:#555;margin-top:2px">${p.advice}</div>
          </div>
        </div>`;
      });
      html+=`<div style="margin-top:12px;padding:10px;background:#0f0a06;border-radius:8px;font-size:12px;color:#7c7f96;line-height:1.6">
        Pay MUST PAY first, then SOON if you can. CAN WAIT items won't cause immediate damage — contact the creditor if you'll miss a due date.
      </div>
      <div style="margin-top:10px">
        <div style="font-size:11px;color:#555;margin-bottom:4px">Tight week threshold: <strong style="color:#e0923b">${fmt(tightThreshold)}</strong> — adjust below</div>
        <input type="range" min="300" max="1000" step="50" value="${tightThreshold}" oninput="setTightThreshold(this.value)" style="width:100%;accent-color:#e0923b">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#444"><span>£300</span><span>£1,000</span></div>
      </div>
      </div>`;
    }

    // Sweep setting
    html+=`<div class="card"><div class="row" style="align-items:center">
      <div><div style="font-size:13px;font-weight:600">Default sweep</div><div style="font-size:12px;color:#7c7f96;margin-top:2px">% of income that goes to the pot</div></div>
      <div style="font-weight:700;font-size:18px;color:#5b8def">${sweepPct}%</div>
    </div>
    <input type="range" min="20" max="80" step="5" value="${sweepPct}" oninput="setSweep(this.value)" style="width:100%;margin-top:10px;accent-color:#5b8def">
    <div class="slider-ends"><span>20%</span><span>80%</span></div>
    </div>`;

    // Buffer target. £0 = off, and off is the default — money only starts
    // being held back once a target is deliberately set.
    html+=`<div class="card"><div class="row" style="align-items:center">
      <div><div style="font-size:13px;font-weight:600">Buffer pot target</div><div style="font-size:12px;color:#7c7f96;margin-top:2px">Cash cushion filled before anything reaches the debts</div></div>
      <div style="font-weight:700;font-size:18px;color:${bufferTarget>0?'#7db87d':'#555'}">${bufferTarget>0?fmtS(bufferTarget):'Off'}</div>
    </div>
    <input type="range" min="0" max="500" step="25" value="${bufferTarget}" oninput="setBufferTarget(this.value)" style="width:100%;margin-top:10px;accent-color:#7db87d">
    <div class="slider-ends"><span>Off</span><span>£500</span></div>
    </div>`;

    // Notification settings
    html+=`<div class="card">
      <div class="row" style="align-items:center;margin-bottom:${notificationsEnabled?'10px':'0'}">
        <div><div style="font-size:13px;font-weight:600">Notifications</div><div style="font-size:12px;color:#7c7f96;margin-top:2px">Push reminders for upcoming due dates</div></div>
        <button onclick="toggleNotifications()" style="width:44px;height:24px;border-radius:12px;border:none;background:${notificationsEnabled?'#5b8def':'#2a2d3e'};position:relative;flex-shrink:0;padding:0">
          <div style="width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:${notificationsEnabled?'23px':'3px'};transition:left .15s"></div>
        </button>
      </div>`;
    if(notificationsEnabled){
      html+=`<div style="font-size:11px;color:#555;margin-bottom:6px">Notify this many days before a due date</div>
      <div style="display:flex;gap:6px;margin-bottom:12px">
        ${[1,2,3].map(n=>`<button onclick="setNotifyDays(${n})" style="flex:1;padding:8px;border-radius:6px;border:1px solid ${notifyDaysBefore===n?'#5b8def':'#2a2d3e'};background:${notifyDaysBefore===n?'#141a2e':'#0f1117'};color:${notifyDaysBefore===n?'#5b8def':'#7c7f96'};font-size:13px;font-weight:600">${n} day${n===1?'':'s'}</button>`).join('')}
      </div>
      ${renderDevicePushRow()}
      <button class="btn-ghost" style="width:100%" onclick="sendTestNotification()">Send test notification</button>
      ${notifyTestStatus?`<div style="font-size:11px;color:#7c7f96;margin-top:8px;text-align:center">${notifyTestStatus}</div>`:''}`;
    }
    html+=`</div>`;
  }

  // ---------- WHAT IF ----------
  else if(view==='whatif'){
    const baseMonths=months.length;
    const baseDate=getMonthLabel(baseMonths,true);
    html+=`<p class="desc">See how much a lump sum or extra monthly payment would accelerate your plan.</p>`;

    // Lump sum section
    html+=`<div class="card" style="border-radius:12px;margin-bottom:12px">
      <h2>One-off lump sum</h2>
      <div style="font-size:13px;color:#7c7f96;margin-bottom:14px">What if you threw an extra payment at your current target right now?</div>
      <div class="field-label">Extra amount (£)</div>
      <input id="lumpInput" class="field-input" type="number" inputmode="decimal" placeholder="e.g. 500" style="font-size:18px;padding:12px;margin-bottom:14px" oninput="calcLump()">
      <div id="lumpResult" style="display:none;background:#0f1117;border-radius:8px;padding:12px;font-size:13px">
        <div class="row" style="margin-bottom:8px">
          <span style="color:#7c7f96">Current debt-free date</span>
          <span style="font-weight:600">${baseDate}</span>
        </div>
        <div class="row" style="margin-bottom:8px">
          <span style="color:#7c7f96">New debt-free date</span>
          <strong id="lumpNewDate" style="color:#7db87d"></strong>
        </div>
        <div class="row" style="margin-bottom:4px">
          <span style="color:#7c7f96">Months saved</span>
          <strong id="lumpMonthsSaved" style="color:#7db87d;font-size:18px"></strong>
        </div>
        <div id="lumpTarget" style="font-size:11px;color:#555;margin-top:8px"></div>
      </div>
    </div>`;

    // Extra monthly section
    html+=`<div class="card" style="border-radius:12px;margin-bottom:12px">
      <h2>Extra every month</h2>
      <div style="font-size:13px;color:#7c7f96;margin-bottom:14px">What if you increased your monthly budget?</div>
      <label class="slider-label">Extra per month: <strong id="extraMonthlyLabel" style="color:#5b8def">${fmt(0)}</strong></label>
      <input type="range" min="0" max="1000" step="25" id="extraMonthlySlider" value="0" oninput="calcExtraMonthly(this.value)" style="width:100%;accent-color:#5b8def">
      <div class="slider-ends"><span>£0</span><span>+£1,000/mo</span></div>
      <div id="extraMonthlyResult" style="margin-top:14px;background:#0f1117;border-radius:8px;padding:12px;font-size:13px">
        <div class="row" style="margin-bottom:8px">
          <span style="color:#7c7f96">Current budget</span>
          <span style="font-weight:600">${fmt(budget)}/mo</span>
        </div>
        <div class="row" style="margin-bottom:8px">
          <span style="color:#7c7f96">New budget</span>
          <strong id="extraMonthlyBudget" style="color:#5b8def">${fmt(budget)}/mo</strong>
        </div>
        <div class="row" style="margin-bottom:8px">
          <span style="color:#7c7f96">New debt-free date</span>
          <strong id="extraMonthlyDate" style="color:#7db87d">${baseDate}</strong>
        </div>
        <div class="row">
          <span style="color:#7c7f96">Months saved</span>
          <strong id="extraMonthlySaved" style="color:#7db87d;font-size:18px">0</strong>
        </div>
      </div>
    </div>`;

    // Comparison table for common extra amounts
    const extras=[100,200,300,500];
    html+=`<div class="card" style="border-radius:12px">
      <h2>Quick comparison</h2>
      <div style="font-size:12px;color:#7c7f96;margin-bottom:12px">How different monthly increases change the finish line.</div>`;
    extras.forEach(extra=>{
      const newM=simulate(debts,budget+extra).length;
      const saved=baseMonths-newM;
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2a2d3e">
        <span style="font-size:13px;color:#e8e8ec">+${fmt(extra)}/mo</span>
        <div style="text-align:right">
          <div style="font-weight:700;color:#7db87d">${getMonthLabel(newM,true)}</div>
          <div style="font-size:11px;color:#555">${saved>0?saved+' months sooner':'no change'}</div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }

  // ---------- MONTHLY SCHEDULE ----------
  else if(view==='monthly'){
    const phase=cm?.phase==='arrears';
    html+=`<p class="desc">The full month-by-month plan. Phase 1 clears arrears, Phase 2 is the snowball.</p>
    <div class="phase-badge" style="background:${phase?'#3a1a1a':'#1a2535'};color:${phase?'#e05c5c':'#5b8def'};border:1px solid ${phase?'#5a2a2a':'#2a3d52'}">${phase?'⚠ Arrears phase':'❄ Snowball phase'}</div>
    ${phaseSwitch?`<span style="font-size:12px;color:#555;margin-left:10px">Snowball starts ${getMonthLabel(phaseSwitch.month,true)}</span>`:''}
    <div class="month-nav"><button onclick="changeMonth(-1)">‹</button>
      <div class="month-display"><div style="font-size:16px;font-weight:700;color:#fff">${getMonthLabel(selectedMonth)}</div><div style="font-size:11px;color:#7c7f96;margin-top:2px">Month ${selectedMonth} of ${totalMonths}</div></div>
      <button onclick="changeMonth(1)">›</button></div>`;
    if(cm){
      html+=`<div class="total-card"><div class="row"><div><div style="font-size:11px;color:#7c9fb5;text-transform:uppercase;letter-spacing:.08em">Total out this month</div><div style="font-size:26px;font-weight:700;color:#5b8def;margin-top:2px">${fmt(cm.totalOut)}</div></div></div></div>`;
      cm.payments.filter(p=>p.wasActive||p.total>0.005).forEach((p,i)=>{
        const debt=debts.find(d=>d.id===p.id);
        const isSB=p.extra>0.005,isArr=p.arrearsPaid>0.005,isClr=p.cleared&&p.wasActive;
        const bg=isClr?'card-green':isSB||isArr?'card-blue':'';
        html+=`<div class="card ${bg}"><div class="row"><div style="display:flex;align-items:flex-start;gap:8px"><div class="dot" style="background:${COLORS[i%COLORS.length]}"></div><div>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-weight:600;font-size:15px">${esc(p.name)}</span>${isSB?'<span class="badge badge-blue">SNOWBALL</span>':''}${isArr?'<span class="badge badge-red">CLEARING ARREARS</span>':''}${isClr?'<span class="badge badge-green">CLEARED ✓</span>':''}</div>
          <div style="font-size:12px;color:#7c7f96;margin-top:3px">${isSB?`Min <strong style="color:#e8e8ec">${fmt(p.minPaid)}</strong> + snowball <strong style="color:#5b8def">${fmt(p.extra)}</strong>`:''}${isArr?`Min <strong style="color:#e8e8ec">${fmt(p.minPaid)}</strong> + arrears <strong style="color:#e05c5c">${fmt(p.arrearsPaid)}</strong>`:''}${!isSB&&!isArr&&p.total>0.005?'Minimum payment':''}</div>
          ${debt?.due?`<div style="font-size:11px;color:#555;margin-top:2px">Due ${ord(debt.due)}</div>`:''}
          </div></div><div style="text-align:right;flex-shrink:0;margin-left:8px"><div style="font-size:22px;font-weight:700;color:${isClr?'#7db87d':isSB?'#5b8def':isArr?'#e05c5c':'#e8e8ec'}">${p.total>0.005?fmt(p.total):'—'}</div>${p.remaining>0.005?`<div style="font-size:11px;color:#555;margin-top:1px">${fmt(p.remaining)} left</div>`:''}</div></div></div>`;
      });
    }
  }

  // ---------- MILESTONES ----------
  else if(view==='milestones'){
    html+=`<p class="desc"><span style="color:#e05c5c;font-weight:600">Phase 1</span> — arrears cleared by ${phaseSwitch?getMonthLabel(phaseSwitch.month,true):'—'}. <span style="color:#5b8def;font-weight:600">Phase 2</span> — snowball.<br>Debt-free: <strong style="color:#7db87d">${getMonthLabel(totalMonths)}</strong></p>`;
    const active=debts.filter(d=>d.balance>0);
    active.forEach((d,i)=>{
      const m=milestones[d.id];
      html+=`<div style="display:flex;gap:12px;margin-bottom:12px;align-items:flex-start"><div class="milestone-line"><div class="milestone-dot" style="background:${m?COLORS[i%COLORS.length]:'#2a2d3e'}">${i+1}</div>${i<active.length-1?'<div class="connector"></div>':''}</div>
        <div class="card" style="flex:1;margin:0"><div class="row"><div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-weight:600">${esc(d.name)}</span>${d.arrears>0?'<span class="badge badge-red">ARREARS</span>':''}</div>
        <div style="font-size:12px;color:#7c7f96;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap"><span>${fmt(d.balance)}</span>${d.arrears>0?`<span style="color:#e05c5c">${fmt(d.arrears)} overdue</span>`:''}<span>${d.apr>0?d.apr+'% APR':'0%'}</span></div></div>
        <div style="text-align:right;flex-shrink:0;margin-left:10px"><div style="font-size:14px;font-weight:700;color:${m?'#7db87d':'#7c7f96'}">${m?getMonthLabel(m,true):'—'}</div>${m?`<div style="font-size:11px;color:#555">Month ${m}</div>`:''}</div></div></div></div>`;
    });
    const hmrc=debts.find(d=>d.id===11);
    html+=`<div class="card card-yellow"><div style="font-weight:600">HMRC — ${fmt(hmrc?.balance??0)}</div><div style="font-size:12px;color:#b5b07c;margin-top:4px">Not in the snowball. Call 0300 200 3835 to agree Time to Pay.</div></div>`;
  }

  // ---------- HISTORY ----------
  else if(view==='history'){
    const initialTotal=DEBTS_INITIAL.reduce((s,d)=>s+d.balance,0);
    const totalPaidAllTime=history.reduce((s,h)=>s+h.totalPaid,0);
    const latestTotal=history.length?history[0].debtSnapshot.reduce((s,d)=>s+d.balance,0):totalDebt;
    const totalReduction=initialTotal-latestTotal;
    html+=`<p class="desc">Every completed cycle, archived automatically — nothing is ever deleted.</p>`;
    html+=`<div class="total-card">
      <div class="row" style="margin-bottom:8px"><span style="color:#7c7f96;font-size:12px">Total paid across all cycles</span><strong style="color:#7db87d">${fmt(totalPaidAllTime)}</strong></div>
      <div class="row"><span style="color:#7c7f96;font-size:12px">Total debt reduction</span><strong style="color:#5b8def">${fmt(totalReduction)}</strong></div>
    </div>`;
    if(!history.length){
      html+=`<div class="card"><div style="font-size:13px;color:#7c7f96">No cycles completed yet — this fills in after your first "Start new cycle".</div></div>`;
    }
    history.forEach((h,i)=>{
      const cycleTotal=h.debtSnapshot.reduce((s,d)=>s+d.balance,0);
      const prev=history[i+1];
      const prevTotal=prev?prev.debtSnapshot.reduce((s,d)=>s+d.balance,0):initialTotal;
      const reduced=prevTotal-cycleTotal;
      const cleared=h.debtsPaid.filter(p=>{
        const snap=h.debtSnapshot.find(d=>d.id===p.id);
        return snap&&snap.balance<=0.005;
      });
      const dateRange=`${h.startedAt?new Date(h.startedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—'} → ${new Date(h.closedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`;
      const notes=parseCycleNotes(h.notes);
      html+=`<div class="card" style="border-radius:12px;margin-bottom:12px">
        <div class="row" style="margin-bottom:8px">
          <span style="font-weight:700;font-size:14px">Cycle ${h.cycleNumber}</span>
          <span style="font-size:11px;color:#555">${dateRange}</span>
        </div>
        ${renderCycleVerdict(notes)}
        <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#7c7f96;margin-bottom:${reduced>0.005||cleared.length?'8px':'0'}">
          <span>In: <strong style="color:#e8e8ec">${fmt(h.totalIncome)}</strong></span>
          <span>Paid: <strong style="color:#7db87d">${fmt(h.totalPaid)}</strong></span>
          <span>Balance at close: <strong style="color:#e8e8ec">${fmtS(cycleTotal)}</strong></span>
        </div>
        ${reduced>0.005?`<div style="background:#0f1117;border-radius:6px;height:5px;overflow:hidden;margin-bottom:6px"><div style="width:${Math.min(100,Math.max(2,(reduced/Math.max(prevTotal,1))*100))}%;height:100%;background:#7db87d"></div></div><div style="font-size:11px;color:#7db87d;${cleared.length?'margin-bottom:6px':''}">${fmt(reduced)} reduced this cycle</div>`:''}
        ${cleared.length?`<div style="font-size:12px;color:#7db87d">🎉 Cleared: ${cleared.map(c=>esc(c.name)).join(', ')}</div>`:''}
      </div>`;
    });
  }

  // ---------- EDIT ----------
  else if(view==='edit'){
    html+=`<p class="desc">Update figures as things change. Tap Save to recalculate.<br><strong style="color:#7db87d">Floor</strong> is the minimum you've committed to — the number a creditor is told and held to. Leave it blank where nothing is agreed yet. The plan still pays the higher target figure whenever the money is there.</p>`;
    debts.forEach((d,i)=>{
      const ev=editDraft[d.id]||{balance:d.balance,apr:d.apr,min:d.min,arrears:d.arrears,due:d.due??'',account:d.account||'personal',note:d.note,floorPayment:d.floorPayment??''};
      html+=`<div class="card" style="border-radius:12px;margin-bottom:12px"><div class="row" style="align-items:center;margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px"><div class="dot" style="background:${COLORS[i%COLORS.length]};margin-top:0"></div><span style="font-weight:700;font-size:15px">${esc(d.name)}</span>${d.arrears>0?'<span class="badge badge-red">ARREARS</span>':''}</div><button onclick="openArchiveModal(${d.id})" style="background:none;border:none;color:#555;font-size:11px;font-weight:600;text-decoration:underline;padding:0;flex-shrink:0">archive</button></div>
      <div class="edit-grid">${[['balance','Balance (£)'],['arrears','Arrears (£)'],['apr','APR (%)'],['min','Min. Payment (£)'],['floorPayment','Floor (£)'],['due','Due Date (day)']].map(([f,label])=>`<div><div class="field-label"${f==='floorPayment'?' style="color:#7db87d"':''}>${label}</div><input class="field-input" type="number" min="0" step="${f==='apr'?'0.1':f==='due'?'1':'0.01'}" value="${ev[f]}"${f==='floorPayment'?' placeholder="not set"':''} oninput="updateDraft(${d.id},'${f}',this.value)"></div>`).join('')}<div><div class="field-label" style="color:${ev.account==='business'?'#e0923b':'#5b8def'}">Account</div><select class="field-input" style="background:#0f1117;color:#e8e8ec" onchange="updateDraft(${d.id},'account',this.value)"><option value="personal" ${ev.account==='personal'?'selected':''}>Personal</option><option value="business" ${ev.account==='business'?'selected':''}>Business</option></select></div><div style="grid-column:1/-1"><div class="field-label">Note</div><input class="field-input" type="text" value="${esc(ev.note||'')}" oninput="updateDraft(${d.id},'note',this.value)"></div></div></div>`;
    });
    html+=`<button class="btn-ghost" style="width:100%;margin-bottom:12px;border-style:dashed" onclick="openAddDebtModal()">+ Add debt</button>`;
    html+=`<div style="display:flex;gap:10px;margin-top:4px"><button id="saveBtn" class="btn-primary" style="flex:1" onclick="applyEdits()">Save &amp; Recalculate</button><button class="btn-ghost" onclick="resetDebts()">Reset</button></div>`;
    if(archivedDebts.length){
      html+=`<div class="card" style="border-radius:12px;margin-top:16px">
        <button onclick="archivedExpanded=!archivedExpanded;renderAll()" style="width:100%;background:none;border:none;color:#7c7f96;font-size:13px;font-weight:600;text-align:left;padding:0;cursor:pointer">${archivedExpanded?'▼':'▶'} Archived (${archivedDebts.length})</button>`;
      if(archivedExpanded){
        archivedDebts.forEach((d,i)=>{
          html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;${i<archivedDebts.length-1?'border-bottom:1px solid #2a2d3e':''};margin-top:${i===0?'12px':'0'}">
            <div>
              <span style="font-size:13px;color:#555">${esc(d.name)}</span>
              <div style="font-size:11px;color:#555;margin-top:1px">${fmt(d.balance)}${d.note?` · ${esc(d.note)}`:''}</div>
            </div>
            <button onclick="restoreDebt(${d.id})" style="padding:5px 10px;border-radius:6px;border:1px solid #3a3d52;background:transparent;color:#7c7f96;font-size:11px;font-weight:600">Restore</button>
          </div>`;
        });
      }
      html+=`</div>`;
    }
  }

  // ---------- OVERVIEW ----------
  else if(view==='overview'){
    html+=`<p class="desc">All debts at a glance.</p>`;
    debts.forEach((d,i)=>{
      html+=`<div class="card"><div class="row"><div style="display:flex;align-items:flex-start;gap:8px"><div class="dot" style="background:${COLORS[i%COLORS.length]}"></div><div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-weight:600;font-size:14px">${esc(d.name)}</span>${d.arrears>0?'<span class="badge badge-red">ARREARS</span>':''}</div>
      <div style="font-size:12px;color:#7c7f96;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap">${d.apr>0?`<span>${d.apr}% APR</span>`:''}${d.min>0?`<span>Min: ${fmt(d.min)}</span>`:''}${floorOf(d)!==null?`<span style="color:#7db87d">Floor: ${fmt(floorOf(d))}</span>`:''}${d.due?`<span>Due: ${ord(d.due)}</span>`:''}${d.arrears>0?`<span style="color:#e05c5c">Arrears: ${fmt(d.arrears)}</span>`:''}</div>
      ${d.note?`<div style="font-size:11px;color:#555;margin-top:3px;font-style:italic">${esc(d.note)}</div>`:''}</div></div>
      <div style="font-size:18px;font-weight:700;color:${d.balance===0?'#3a4a3a':'#e8e8ec'};flex-shrink:0;margin-left:8px">${fmt(d.balance)}</div></div></div>`;
    });
  }

  // ---------- BORROWED ----------
  // Standalone notes tab: no read/write of any other app state or calculation.
  else if(view==='borrowed'){
    html+=`<p class="desc">Track informal short-term borrowing — from people or from your own savings pots. Purely for notes; nothing here affects the debt plan.</p>`;
    const grandTotal=borrowedActive.reduce((s,b)=>s+b.amount,0);
    const sourceCount=new Set(borrowedActive.map(b=>b.source_name)).size;
    if(grandTotal<=0.005){
      html+=`<div class="card card-green" style="text-align:center;padding:20px;border-radius:12px;margin-bottom:16px">
        <div style="font-size:16px;font-weight:700;color:#7db87d">Nothing outstanding ✓</div>
        <div style="font-size:12px;color:#7c9f7c;margin-top:4px">Keep it that way.</div>
      </div>`;
    }else{
      html+=`<div class="total-card" style="background:linear-gradient(135deg,#1a2535,#141a2e);margin-bottom:16px">
        <div style="font-size:10px;color:#7c9fb5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Total borrowed</div>
        <div style="font-size:32px;font-weight:800;color:#fff">${fmt(grandTotal)}</div>
        <div style="font-size:12px;color:#7c7f96;margin-top:4px">${borrowedActive.length} active loan${borrowedActive.length===1?'':'s'} across ${sourceCount} source${sourceCount===1?'':'s'}</div>
      </div>`;
    }

    // Group active loans by source: savings-flagged first, then alphabetical.
    const groups={};
    borrowedActive.forEach(b=>{
      const key=b.source_name+'|'+b.is_savings;
      if(!groups[key])groups[key]={source_name:b.source_name,is_savings:b.is_savings,items:[],total:0};
      groups[key].items.push(b);
      groups[key].total+=b.amount;
    });
    const groupList=Object.values(groups).sort((a,b)=>{
      if(a.is_savings!==b.is_savings)return a.is_savings?-1:1;
      return a.source_name.localeCompare(b.source_name);
    });

    groupList.forEach(g=>{
      html+=`<div class="card" style="border-radius:12px;margin-bottom:12px">
        <div class="row" style="margin-bottom:8px;align-items:center">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="dot" style="background:${g.is_savings?'#7db87d':'#5b8def'};margin-top:0"></div>
            <span style="font-weight:700;font-size:15px">${esc(g.source_name)}</span>
            <span class="badge" style="background:${g.is_savings?'#0d1a0d':'#0a1228'};color:${g.is_savings?'#7db87d':'#5b8def'}">${g.is_savings?'SAVINGS':'PERSON'}</span>
          </div>
          <strong style="color:#e8e8ec">${fmt(g.total)} total</strong>
        </div>`;
      g.items.forEach((b,i)=>{
        html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;${i<g.items.length-1?'border-bottom:1px solid #2a2d3e':''}">
          <div>
            <div style="font-size:13px;color:${b.note?'#e8e8ec':'#555'}">${esc(b.note)||'No note'}</div>
            <div style="font-size:11px;color:#555;margin-top:1px">${formatBorrowedDate(b.borrowed_at)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <strong>${fmt(b.amount)}</strong>
            <button onclick="openRepayModal(${b.id})" style="padding:5px 10px;border-radius:6px;border:1px solid #2a4a2a;background:transparent;color:#7db87d;font-size:11px;font-weight:600">Repaid ✓</button>
          </div>
        </div>`;
      });
      html+=`</div>`;
    });

    html+=`<div style="${borrowedActive.length?'':'text-align:center'};margin-bottom:16px"><button class="btn-primary" ${borrowedActive.length?'style="width:100%"':'style="padding:12px 24px"'} onclick="openAddLoanModal()">+ Log a loan</button></div>`;

    html+=`<div class="card" style="border-radius:12px">
      <button onclick="repaidLogExpanded=!repaidLogExpanded;renderAll()" style="width:100%;background:none;border:none;color:#7c7f96;font-size:13px;font-weight:600;text-align:left;padding:0;cursor:pointer">${repaidLogExpanded?'▼':'▶'} Repaid (${borrowedRepaid.length})</button>`;
    if(repaidLogExpanded){
      borrowedRepaid.forEach((b,i)=>{
        html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;${i<borrowedRepaid.length-1?'border-bottom:1px solid #2a2d3e':''};margin-top:${i===0?'12px':'0'}">
          <div>
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:13px;color:#555">${esc(b.source_name)}</span>
              <span style="font-size:9px;color:#555;text-transform:uppercase;letter-spacing:.06em">${b.is_savings?'savings':'person'}</span>
            </div>
            <div style="font-size:11px;color:#555;margin-top:1px">${esc(b.note)||'No note'} · ${formatBorrowedDate(b.borrowed_at)} → ${formatBorrowedDate(b.repaid_at)}</div>
          </div>
          <strong style="color:#555;text-decoration:line-through">${fmt(b.amount)}</strong>
        </div>`;
      });
    }
    html+=`</div>`;
  }

  document.getElementById('tabContent').innerHTML=html;
}

// ---------- Floors & buffer rendering ----------
// The buffer sits under the two pots rather than beside them: three cards
// across is unreadable on a phone, and the buffer is a different kind of
// number — a cushion, not money earmarked for a payment.
function renderBufferStrip(){
  if(bufferTarget<=0.005){
    return `<div style="display:flex;justify-content:space-between;align-items:center;background:#0d1512;border:1px solid #1e3a2e;border-radius:10px;padding:9px 12px;margin-bottom:14px">
      <div>
        <div style="font-size:10px;color:#7db87d;text-transform:uppercase;letter-spacing:.08em">Buffer pot</div>
        <div style="font-size:11px;color:#7c7f96;margin-top:2px">${bufferPot>0.005?`${fmt(bufferPot)} held · no target set`:'Not set up — a small cushion absorbs a bad month'}</div>
      </div>
      <button onclick="scrollToBufferSetting()" style="padding:5px 10px;border-radius:6px;border:1px solid #2a4a3a;background:transparent;color:#7db87d;font-size:11px;font-weight:600;flex-shrink:0">Set a target</button>
    </div>`;
  }
  const pct=Math.min(100,Math.round((bufferPot/bufferTarget)*100));
  const full=bufferPot>=bufferTarget-0.005;
  return `<div style="background:#0d1512;border:1px solid #1e3a2e;border-radius:10px;padding:9px 12px;margin-bottom:14px">
    <div class="row" style="align-items:center;margin-bottom:6px">
      <div style="display:flex;align-items:baseline;gap:8px">
        <span style="font-size:10px;color:#7db87d;text-transform:uppercase;letter-spacing:.08em">Buffer pot</span>
        <span style="font-size:11px;color:#7c7f96">${full?'full ✓':`${fmt(bufferTarget-bufferPot)} to go`}</span>
      </div>
      <strong style="font-size:15px;color:${full?'#7db87d':'#e8e8ec'}">${fmt(bufferPot)} <span style="font-size:11px;color:#555;font-weight:600">/ ${fmt(bufferTarget)}</span></strong>
    </div>
    <div style="background:#0f1117;border-radius:6px;height:4px;overflow:hidden">
      <div style="width:${pct}%;height:100%;background:#7db87d;border-radius:6px;transition:width .3s"></div>
    </div>
  </div>`;
}
// Two verdicts instead of one pass/fail. Floors is the one that matters —
// every floor met is an on-track cycle even when the targets slip.
function renderFloorIndicators(fs){
  const floorChip=fs.floorTotal<=0.005
    ? {bg:'#151821',bd:'#2a2d3e',fg:'#7c7f96',icon:'—',label:'Floors',sub:'none set yet'}
    : fs.floorsMet
      ? {bg:'#0d1a0d',bd:'#2a4a2a',fg:'#7db87d',icon:'✅',label:'Floors met',sub:`${fmt(fs.floorTotal)} committed`}
      : fs.shortBy>0.005
        ? {bg:'#1a0f08',bd:'#5a3a1a',fg:'#e0923b',icon:'⚠',label:'Floors at risk',sub:`${fmt(fs.shortBy)} short in the pots`}
        : {bg:'#1a1608',bd:'#4a4020',fg:'#e0c060',icon:'⚠',label:'Floors not yet',sub:`${fmt(fs.floorTotal-fs.floorPaid)} still to pay · covered`};
  const targetChip=fs.targetMet
    ? {bg:'#0d1a0d',bd:'#2a4a2a',fg:'#7db87d',icon:'✅',label:'Target met',sub:`${fmt(fs.targetPaid)} paid`}
    : {bg:'#151821',bd:'#2a2d3e',fg:'#7c7f96',icon:'⚠',label:'Target not met',sub:`${fmt(Math.max(0,fs.targetTotal-fs.targetPaid))} to go`};
  const chip=c=>`<div style="flex:1;min-width:130px;background:${c.bg};border:1px solid ${c.bd};border-radius:8px;padding:8px 10px">
      <div style="font-size:12px;font-weight:700;color:${c.fg}">${c.icon} ${c.label}</div>
      <div style="font-size:11px;color:#7c7f96;margin-top:2px">${c.sub}</div>
    </div>`;
  const nudge=fs.noFloorSet>0
    ? `<div style="font-size:11px;color:#e0923b;margin-bottom:10px">${fs.noFloorSet} debt${fs.noFloorSet===1?' has':'s have'} no floor set — add one under <button onclick="setView('edit')" style="background:none;border:none;padding:0;color:#e0923b;font-size:11px;font-weight:600;text-decoration:underline">Edit Debts</button> so it counts.</div>`
    : '';
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${chip(floorChip)}${chip(targetChip)}</div>${nudge}`;
}
// The "behind" ledger. Shortfalls are shown, never applied: nothing here
// changes what the plan asks for until Catch up is tapped.
function renderBehindPanel(){
  if(!floorShortfalls.length)return '';
  const total=floorShortfalls.reduce((s,f)=>s+f.amount,0);
  let out=`<div class="card" style="border:1px solid #5a3a1a;background:#160f08;border-radius:12px">
    <div class="row" style="margin-bottom:6px">
      <h2 style="margin:0;color:#e0923b">Behind on floors</h2>
      <strong style="color:#e0923b">${fmt(total)}</strong>
    </div>
    <div style="font-size:12px;color:#7c7f96;line-height:1.5;margin-bottom:10px">Floors missed in past cycles. None of this has been added to your plan — catch up only when you actually can.</div>`;

  // are out — the sweep shouldn't set money aside for a payment that
  // deliberately isn't happening.

function readOverride(id){
  const el=document.getElementById(id);

}
function currentAllocation(){
  const amt=parseNum(document.getElementById('logAmount')?.value||0);

  const oBuf=readOverride('logBuffer'),oBiz=readOverride('logBiz'),oPer=readOverride('logPer'),oSav=readOverride('logSaved');

// A cycle payment is in exactly one of four states: unpaid, floor (the
// committed minimum went out, the target didn't), paid (the full target), or
// missed (nothing went out, deliberately). Every transition runs through
// here so the pot is refunded for whatever the old state took and charged
// for whatever the new one takes — the pot arithmetic was the easiest thing
// to get wrong when this was three separate toggles.
function paymentState(id){
  if(paidThisCycle.includes(id))return 'paid';
  if(floorPaidThisCycle.includes(id))return 'floor';
  if(missedThisCycle.includes(id))return 'missed';
  return 'unpaid';
}
function setPaymentState(id,next){
  const p=getCyclePayments().find(x=>x.id===id);
  if(!p)return;
  const isBiz=p.account==='business';
  const potAdd=v=>{ if(isBiz)bizPot=Math.max(0,bizPot+v); else perPot=Math.max(0,perPot+v); };
  const current=paymentState(id);
  if(current===next)next='unpaid'; // tapping the control you're already in undoes it
  if(current==='paid')potAdd(p.amount);
  else if(current==='floor')potAdd(p.floorDue||0);
  paidThisCycle=paidThisCycle.filter(x=>x!==id);
  floorPaidThisCycle=floorPaidThisCycle.filter(x=>x!==id);
  missedThisCycle=missedThisCycle.filter(x=>x!==id);
  if(next==='paid'){paidThisCycle=[...paidThisCycle,id];potAdd(-p.amount);}
  else if(next==='floor'){floorPaidThisCycle=[...floorPaidThisCycle,id];potAdd(-(p.floorDue||0));}
  else if(next==='missed'){missedThisCycle=[...missedThisCycle,id];}
  persist('cashflow');renderAll();
}
function togglePaid(id){setPaymentState(id,'paid');}
function togglePaidFloor(id){setPaymentState(id,'floor');}

async function deleteIncome(idx){
  const e=incomeLog[idx];
  if(!e)return;
  bizPot=Math.max(0,bizPot-(e.bizAmt||0));
  perPot=Math.max(0,perPot-(e.perAmt||0));
  savingsPot=Math.max(0,savingsPot-(e.savedAmt||0));
  bufferPot=Math.max(0,bufferPot-(e.bufferAmt||0));
  incomeLog.splice(idx,1);
  persist('cashflow');renderAll();
  if(e.id!=null){
    try{ await fetch('/debt/api/income/'+e.id,{method:'DELETE'}); }
    catch(err){ console.error('Failed to delete income entry',err); }
  }
}

function openSyncBalances(){
  // Seed the draft with the PROJECTED balance after one cycle (month 1 of the sim).
  // This mirrors what the plan expects to happen, giving a realistic starting estimate to tweak.
  syncDraft={};
  const months=getSim();
  const m1=months[0];
  debts.forEach(d=>{
    if(d.balance<=0.005)return;
    let projected=d.balance;
    // A missed debt had no payment this cycle, so its estimate stays at the
    // current balance instead of assuming the plan's payment happened.
    if(m1&&!missedThisCycle.includes(d.id)){
      const p=m1.payments.find(x=>x.id===d.id);
      if(p&&p.wasActive){
        // A floor-only payment sent less than the plan assumed, so the
        // estimate has to come down by the floor, not the full payment.
        if(floorPaidThisCycle.includes(d.id)){
          const cp=getCyclePayments().find(x=>x.id===d.id);
          projected=Math.max(0,d.balance-(cp&&cp.floorDue!==null?cp.floorDue:0));
        }else projected=p.remaining;

    syncDraft[d.id]=projected.toFixed(2);

// The "Push to this device" row inside the Notifications card. ntfy needs

// Push is per-device: each phone/desktop enables itself here and gets its

function renderDevicePushRow(){
  let inner='';
  if(pushState==='on'){

  }else if(pushState==='off'){
