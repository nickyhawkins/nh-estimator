<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,'Inter','Segoe UI',sans-serif;background:#0f1117;color:#e8e8ec;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,20px)}
  button{cursor:pointer;font-family:inherit}
  input{font-family:inherit}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#2a2d3e;outline:none}

  .field-input{background:#0f1117;border:1px solid #3a3d52;border-radius:6px;color:#e8e8ec;font-size:13px;padding:6px 8px;width:100%}
  .milestone-line{display:flex;flex-direction:column;align-items:center;flex-shrink:0}

  .btn-primary{padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:700;background:#5b8def;color:#fff}

  .check.done{background:#1a3a1a;border-color:#2a4a2a}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
  .modal{background:#1a1d2e;border-top:1px solid #2a2d3e;border-radius:18px 18px 0 0;padding:24px 20px max(24px,env(safe-area-inset-bottom,24px));width:100%;max-width:740px}
  .pot-big{font-size:44px;font-weight:800;letter-spacing:-1px}
  .log-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #2a2d3e;font-size:13px}

<div class="header">
  <div class="inner">
    <div style="font-size:10px;letter-spacing:.15em;color:#7c7f96;text-transform:uppercase;margin-bottom:4px">Debt Snowball · Arrears First</div>
    <h1 style="font-size:24px;font-weight:700;color:#fff;letter-spacing:-.5px">Nicky's Payoff Plan</h1>
    <div id="cycleLine" style="font-size:12px;color:#7c7f96;margin-top:2px"></div>

    <div style="margin-top:16px">
      <label class="slider-label">Monthly debt target: <strong id="budgetLabel" style="color:#fff"></strong> <span style="color:#555">· drives the payoff plan</span></label>
      <input type="range" min="1500" max="3500" step="50" id="budgetSlider" style="width:100%;accent-color:#5b8def">

<script>
const COLORS=["#e05c5c","#e0923b","#d4bc17","#7db87d","#4a9fd4","#7b6fcf","#c466a1","#5bbfb0","#8c9b6e","#6e8c9b","#b07d5c","#9b6e8c"];
// floorPayment mirrors the SQL backfill in db/setup-debt.sql: the
// contractual minimum doubles as the starting floor, and stays null where
// there is no minimum to copy (Brewers' arrears-only trade account, HMRC
// pre-Time-to-Pay) — those need a floor agreed before they can have one.
const DEBTS_INITIAL=[
  {id:2, name:"Currys",       balance:965.72,   apr:39.9, min:25,     arrears:0,        due:15,   account:"personal", note:"Est. figures", floorPayment:25},
  {id:3, name:"Natwest CC",   balance:1111.90,  apr:26.9, min:40.03,  arrears:0,        due:10,   account:"personal", note:"", floorPayment:40.03},
  {id:4, name:"PayPal",       balance:2017.25,  apr:0,    min:93.44,  arrears:0,        due:11,   account:"personal", note:"0% interest", floorPayment:93.44},
  {id:5, name:"Brewers",      balance:2200.89,  apr:0,    min:0,      arrears:2200.89,  due:1,    account:"business", note:"Trade account — full balance in arrears", floorPayment:null},
  {id:6, name:"Amex",         balance:4065.64,  apr:30.4, min:205,    arrears:65.64,    due:28,   account:"business", note:"", floorPayment:205},
  {id:7, name:"Updraft",      balance:3583.81,  apr:17.9, min:264.66, arrears:793.98,   due:20,   account:"personal", note:"", floorPayment:264.66},
  {id:8, name:"Bounce Back",  balance:7733.65,  apr:2.5,  min:182.08, arrears:177.48,   due:14,   account:"business", note:"", floorPayment:182.08},
  {id:9, name:"NatWest Loan", balance:17122.68, apr:19,   min:520.01, arrears:2662.97,  due:15,   account:"personal", note:"", floorPayment:520.01},
  {id:10,name:"Van",          balance:20600,    apr:0,    min:400,    arrears:0,        due:null, account:"business", note:"Family loan — low priority", floorPayment:400},
  {id:11,name:"HMRC",         balance:31510.32, apr:0,    min:0,      arrears:0,        due:null, account:"business", note:"Needs Time to Pay arrangement", floorPayment:null},
];

// ---------- State ----------
let debts=[]; // live debts only — archived ones live in archivedDebts
let archivedDebts=[]; // hidden from the plan/views, kept because history references their ids
let archivedExpanded=false;
let budget=2000;
let sweepPct=50;
let bizPot=0;
let perPot=0;
let savingsPot=0;
let savingsPct=10;
// Floor & target payments. The buffer is a cash cushion filled BEFORE any
// debt allocation; a target of 0 means it is switched off, which is the
// default — it moves real money, so it's opted into, not assumed.
//
// TWO jars, not one, because bizPot and perPot are two real bank accounts and
// neither can rescue the other: a £905 personal cushion does nothing for a
// £387 business minimum falling due. What the buffer is FOR is holding one
// month of contractual minimums (see monthlyMinimums()) so a light month pays
// them out of stored cash instead of putting them into arrears.
let bufferBiz=0;
let bufferPer=0;
let bufferTargetBiz=0;
let bufferTargetPer=0;
const bufferPot=()=>round2(bufferBiz+bufferPer);
const bufferTarget=()=>round2(bufferTargetBiz+bufferTargetPer);
// Running "behind on floors" ledger: [{id,name,amount,since}], one entry per
// debt, written when a cycle closes with a floor unmet. Deliberately inert —
// nothing reads it back into the plan until the user taps Catch up.
let floorShortfalls=[];
let incomeLog=[]; // {id, amount, bizAmt, perAmt, savedAmt, bufferAmt, date}
let paidThisCycle=[]; // array of debt ids paid
// What each tick actually took off a balance this cycle, keyed by debt id:
// {name, nominal, amount, arrearsAmt, potAmt}. Ticking a payment applies it
// to the debt straight away (that's what makes balances and arrears move
// between cycles); this ledger is what lets an un-tick put back precisely
// what was removed, clamping and pot-shortfalls included.
let appliedPayments={};
let missedThisCycle=[]; // debt ids deliberately skipped this cycle — mutually exclusive with paidThisCycle
// Debt ids where the FLOOR was paid but the target wasn't — the third state a
// payment can be in, and the only reason the two verdicts can differ. All
// three lists are mutually exclusive; setPaymentState() is the one place
// that moves an id between them.
let floorPaidThisCycle=[];
let history=[]; // completed cycles, newest first — from debt_plan_cycle_history
let view='cashflow';
let tightThreshold=600;
let lastMilestone='';
let selectedMonth=1;
let editDraft={};
let notifyDaysBefore=3;
let notificationsEnabled=true;
let notifyTestStatus='';
// Web Push to THIS device (the installed PWA), alongside the server-wide
// ntfy transport. States: init (still checking) | unsupported |
// need-install (iOS Safari tab — push only works from the Home Screen app)
// | off | on | busy | denied (blocked in system settings).
let pushState='init';
let swRegistration=null;
// Last-known updated_at per table, echoed back on writes so the server can
// detect a stale save from another device (409) instead of overwriting.
let debtsUpdatedAt=null;
let settingsUpdatedAt=null;
let cashflowUpdatedAt=null;
let conflictBanner='';
let cycleStatus={cycleStartedAt:null,nextRollAt:null,daysSinceStart:0,daysToRoll:null,promptReset:false};
// Cycle number of an auto-rollover whose "sync your balances" prompt has
// been dismissed on this device.
let rollNoticeDismissed=(()=>{try{return Number(localStorage.getItem('debtRollNoticeSeen'))||0;}catch(err){return 0;}})();
let cycleResetDismissed=false;
let borrowedActive=[]; // loaded from GET /debt/api/borrowed on init
let borrowedRepaid=[];
let repaidLogExpanded=false;
let loanIsSavings=false;
// Guards against the seed-overwrite trap (efficiency review finding 1):
// until the server state has actually loaded, saving stays off so a slider
// touch can't push DEBTS_INITIAL over the real balances.
let loadedFromServer=false;
let loadFailed=false;
// Offline read-only mode: when /api/state is unreachable but a snapshot of
// the last synced load exists in localStorage, the app renders that data
// instead of the seed placeholders. Timestamp of the snapshot, or null.
const STATE_CACHE_KEY='debtPlanOfflineCache';
let offlineCachedAt=null;
// Set when a save fails (network or 5xx) — surfaced as a banner instead of
// dying silently in the console; the dirty flags retry on the next save.
let saveError=false;

const JSON_HEADERS={'Content-Type':'application/json'};
let persistTimer=null;
// Which collections have local changes the server hasn't seen. Saving only
// what changed keeps a settings tweak from rewriting the debt rows too —
// call persist('settings') etc.; a bare persist() marks everything (safe
// fallback for anything missed).
const dirty={debts:false,settings:false,cashflow:false};
let persistInFlight=0; // saves awaiting a response — a background refresh waits them out
function persist(...kinds){
  (kinds.length?kinds:['debts','settings','cashflow']).forEach(k=>dirty[k]=true);
  clearTimeout(persistTimer);
  persistTimer=setTimeout(persistNow,400);
}
const PERSIST_BODIES={
  debts:()=>({debts,clientUpdatedAt:debtsUpdatedAt}),
  settings:()=>({budget,sweepPct,savingsPct,tightThreshold,lastMilestone,notifyDaysBefore,notificationsEnabled,bufferTargetBiz,bufferTargetPer,clientUpdatedAt:settingsUpdatedAt}),
  cashflow:()=>({bizPot,perPot,savingsPot,bufferBiz,bufferPer,paidThisCycle,missedThisCycle,floorPaidThisCycle,floorShortfalls,appliedPayments,clientUpdatedAt:cashflowUpdatedAt})
};
async function persistNow(){
  if(!loadedFromServer)return; // never push the fallback seed over real data
  const kinds=Object.keys(dirty).filter(k=>dirty[k]);
  if(!kinds.length)return;
  kinds.forEach(k=>dirty[k]=false);
  persistInFlight++;
  try{
    const results=await Promise.all(kinds.map(k=>
      fetch('/debt/api/'+k,{method:'POST',headers:JSON_HEADERS,body:JSON.stringify(PERSIST_BODIES[k]())})));
    let failed=false;
    for(let i=0;i<results.length;i++){
      if(!results[i].ok&&results[i].status!==409){dirty[kinds[i]]=true;failed=true;continue;}
      await handleWriteResponse(results[i],kinds[i]);
    }
    if(failed!==saveError){saveError=failed;renderAll();}
  }catch(err){
    kinds.forEach(k=>dirty[k]=true); // retried with the next save
    if(!saveError){saveError=true;renderAll();}
    console.error('Failed to save debt plan state',err);
  }finally{
    persistInFlight--;
  }
}
// Applies a write's outcome: on 409, another device saved more recently, so
// hydrate from the fresh copy the server sends back instead of overwriting
// it, and surface the conflict banner. Otherwise just track the new
// updated_at so the next save can be compared correctly.
async function handleWriteResponse(res,kind){
  if(res.status===409){
    const body=await res.json().catch(()=>null);
    if(!body)return;
    if(kind==='debts'){debts=body.current;debtsUpdatedAt=body.updatedAt;}
    else if(kind==='settings'){
      budget=body.current.budget;sweepPct=body.current.sweepPct;savingsPct=body.current.savingsPct;
      tightThreshold=body.current.tightThreshold;lastMilestone=body.current.lastMilestone;
      notifyDaysBefore=body.current.notifyDaysBefore;notificationsEnabled=body.current.notificationsEnabled;
      bufferTargetBiz=body.current.bufferTargetBiz??0;bufferTargetPer=body.current.bufferTargetPer??0;
      settingsUpdatedAt=body.updatedAt;
    }else if(kind==='cashflow'){
      bizPot=body.current.bizPot;perPot=body.current.perPot;savingsPot=body.current.savingsPot;
      bufferBiz=body.current.bufferBiz??0;bufferPer=body.current.bufferPer??0;
      paidThisCycle=body.current.paidThisCycle;missedThisCycle=body.current.missedThisCycle||[];
      floorPaidThisCycle=body.current.floorPaidThisCycle||[];
      floorShortfalls=body.current.floorShortfalls||[];
      appliedPayments=body.current.appliedPayments||{};
      cashflowUpdatedAt=body.updatedAt;
    }
    conflictBanner="Updated on another device — your changes weren't saved. Refreshed to latest.";
    renderAll();
    return;
  }
  if(!res.ok)return;
  const body=await res.json().catch(()=>null);
  if(!body)return;
  if(kind==='debts')debtsUpdatedAt=body.updatedAt;
  else if(kind==='settings')settingsUpdatedAt=body.updatedAt;
  else if(kind==='cashflow')cashflowUpdatedAt=body.updatedAt;
}
function applyStatePayload(s){
  debts=s.debts;
  archivedDebts=s.archivedDebts||[]; // ||[] — pre-feature offline snapshots lack it
  budget=s.settings.budget;
  sweepPct=s.settings.sweepPct;
  savingsPct=s.settings.savingsPct;
  tightThreshold=s.settings.tightThreshold;
  lastMilestone=s.settings.lastMilestone;
  notifyDaysBefore=s.settings.notifyDaysBefore??3;
  notificationsEnabled=s.settings.notificationsEnabled??true;
  // ??/|| throughout — an offline snapshot taken before the buffer was split
  // by account carries the single legacy figure, which was personal money.
  bufferTargetBiz=s.settings.bufferTargetBiz??0;
  bufferTargetPer=s.settings.bufferTargetPer??s.settings.bufferTarget??0;
  bizPot=s.cashflow.bizPot;
  perPot=s.cashflow.perPot;
  savingsPot=s.cashflow.savingsPot;
  bufferBiz=s.cashflow.bufferBiz??0;
  bufferPer=s.cashflow.bufferPer??s.cashflow.bufferPot??0;
  paidThisCycle=s.cashflow.paidThisCycle;
  missedThisCycle=s.cashflow.missedThisCycle||[]; // ||[] — pre-feature offline snapshots lack it
  floorPaidThisCycle=s.cashflow.floorPaidThisCycle||[];
  floorShortfalls=s.cashflow.floorShortfalls||[];
  appliedPayments=s.cashflow.appliedPayments||{}; // ||{} — pre-column rows and old offline snapshots
  incomeLog=s.incomeLog;
  debtsUpdatedAt=s.meta?.debtsUpdatedAt||null;
  settingsUpdatedAt=s.meta?.settingsUpdatedAt||null;
  cashflowUpdatedAt=s.meta?.cashflowUpdatedAt||null;
}
async function loadState(){
  let statePayload=null;
  const stateLoad=(async()=>{
    const res=await fetch('/debt/api/state');
    if(!res.ok)throw new Error('state load failed: '+res.status);
    const s=await res.json();
    applyStatePayload(s);
    statePayload=s;
    loadedFromServer=true;
  })().catch(err=>{
    console.error('Failed to load debt plan state, using defaults',err);
    debts=DEBTS_INITIAL.map(d=>({...d}));
    loadFailed=true; // read-only: persistNow() refuses until a real load
  });
  // These endpoints are independent of /api/state and each other — fetch
  // them alongside it instead of one after another (was 4 serialized round
  // trips before first paint).
  await Promise.all([stateLoad,refreshHistory(),refreshCycleStatus(),refreshBorrowed()]);
  if(loadedFromServer){
    // Snapshot everything the tabs render, for the offline read-only view.
    try{
      localStorage.setItem(STATE_CACHE_KEY,JSON.stringify({
        state:statePayload,history,borrowedActive,borrowedRepaid,cycleStatus,cachedAt:Date.now()
      }));
    }catch(err){/* quota/private mode — offline view just stays unavailable */}
  }else{
    // No server: fall back to the last synced snapshot, still read-only
    // (loadedFromServer stays false, so persistNow()/startNewCycle refuse).
    try{
      const cached=JSON.parse(localStorage.getItem(STATE_CACHE_KEY)||'null');
      if(cached&&cached.state){
        applyStatePayload(cached.state);
        history=cached.history||[];
        borrowedActive=cached.borrowedActive||[];
        borrowedRepaid=cached.borrowedRepaid||[];
        cycleStatus=cached.cycleStatus||cycleStatus;
        offlineCachedAt=cached.cachedAt||null;
        loadFailed=false; // real (if stale) data — show the offline banner instead
      }
    }catch(err){console.error('Offline snapshot unreadable',err);}
  }
  renderAll();
}
async function refreshHistory(){
  try{
    const res=await fetch('/debt/api/history');
    history=await res.json();
  }catch(err){console.error('Failed to load cycle history',err);}
}
async function refreshCycleStatus(){
  try{
    const res=await fetch('/debt/api/cycle-status');
    cycleStatus=await res.json();
  }catch(err){console.error('Failed to load cycle status',err);}
}
// Borrowed money tab — fully standalone from the rest of the app's state.
// See Debt Management App/debt-app-borrowed-money.md.
async function refreshBorrowed(){
  try{
    const res=await fetch('/debt/api/borrowed');
    const data=await res.json();
    borrowedActive=data.active||[];
    borrowedRepaid=data.repaid||[];
  }catch(err){console.error('Failed to load borrowed money data',err);}
}
// cycle_history.notes is JSON written by POST /debt/api/new-cycle. Cycles
// closed before the floors feature have no notes, or notes carrying only
// {missed:[...]} — both parse to an object with no verdict, and render
// without the badges.
function parseCycleNotes(notes){
  if(!notes)return {};
  try{const o=JSON.parse(notes);return o&&typeof o==='object'?o:{};}
  catch(err){return {};}
}
function renderCycleVerdict(notes){
  if(typeof notes.floorsMet!=='boolean'&&typeof notes.targetMet!=='boolean')return '';
  const badge=(ok,label)=>`<span class="badge" style="background:${ok?'#1a3a1a':'#2a1a0a'};color:${ok?'#7db87d':'#e0923b'}">${ok?'✅':'⚠'} ${label}</span>`;
  const shortfalls=Array.isArray(notes.floorShortfalls)?notes.floorShortfalls:[];
  const shortTotal=shortfalls.reduce((s,f)=>s+(Number(f.amount)||0),0);
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
    ${typeof notes.floorsMet==='boolean'?badge(notes.floorsMet,'Floors'):''}
    ${typeof notes.targetMet==='boolean'?badge(notes.targetMet,'Target'):''}
  </div>${shortTotal>0.005?`<div style="font-size:11px;color:#e0923b;margin-bottom:8px">${fmt(shortTotal)} short on ${shortfalls.length} floor${shortfalls.length===1?'':'s'} — ${shortfalls.map(f=>esc(f.name)).join(', ')}</div>`:''}`;
}
// Recognises the history row an automatic rollover wrote, so the app can say
// the cycle turned over without you. Manual closes carry no autoRolled key
// and come back null, as do older rows with no notes at all.
function rollNotice(h){
  if(!h)return null;
  const n=parseCycleNotes(h.notes);
  if(!n.autoRolled)return null;
  return {cycleNumber:h.cycleNumber,closedAt:h.closedAt,
    floorsMet:n.floorsMet===true,
    shortfalls:Array.isArray(n.floorShortfalls)?n.floorShortfalls:[],
    arrearsAdded:Array.isArray(n.arrearsAdded)?n.arrearsAdded:[]};
}
function dismissRollNotice(){
  const n=rollNotice(history[0]);
  if(n){
    rollNoticeDismissed=n.cycleNumber;
    try{localStorage.setItem('debtRollNoticeSeen',String(n.cycleNumber));}catch(err){/* private mode */}
  }
  renderAll();
}
function formatBorrowedDate(d){
  if(!d)return '—';
  return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}
// What a cycle payment has actually had paid to it, in pounds. Since a
// payment can now be any amount, every "is this covered?" test asks this
// rather than which tick-list an id sits in.
//
// The ledger is the truth WHERE IT EXISTS. A tick carrying no ledger entry —
// a cycle that was already open before applied_payments existed — is taken at
// its word exactly as it was before, rather than being read as a payment of
// nothing and turning a settled cycle into a pile of arrears at close.
function paidAmountOf(p){
  const a=appliedPayments[p.id];
  if(a)return a.nominal;
  if(paidThisCycle.includes(p.id))return p.target;
  if(floorPaidThisCycle.includes(p.id))return p.floorDue||0;
  return 0;
}
// Contractual minimums this cycle left uncovered. The MINIMUM is what is
// owed under the agreement, so whatever of it goes unpaid is genuinely
// overdue and joins arrears at close. The FLOOR is discretionary — what
// you have chosen to aim for, above or below that minimum — so missing it
// is not a debt to anyone and goes on the catch-up ledger instead. A floor
// payment BELOW the minimum settles the floor and still leaves contractual
// ground uncovered, which is why both can happen to the same debt.
// Mirrors the same calculation in lib/debtCycle.js's rollOnce().
function getUnpaidMinimums(){
  const cyclePayments=getCyclePayments();
  const out=[];
  for(const d of debts){
    if(d.balance<=0.005)continue;
    const minDue=Math.min(Number(d.min)||0,d.balance);
    if(minDue<=0.005)continue;
    // What actually went out covers the minimum as far as it reaches, and no
    // further. Paying the target in full always covers it (the plan's payment
    // is built on top of the minimum); a floor-only payment covers only as
    // far as the floor reaches, which may fall short; a custom amount covers
    // exactly itself.
    const cp=cyclePayments.find(x=>x.id===d.id);
    const covered=cp?Math.min(minDue,paidAmountOf(cp)):0;
    const unpaid=Math.max(0,minDue-covered);
    if(unpaid<=0.005)continue;
    const newArrears=Math.min(d.balance,d.arrears+unpaid);
    if(newArrears-d.arrears<=0.005)continue; // already fully overdue
    out.push({id:d.id,name:d.name,amount:round2(newArrears-d.arrears)});
  }
  return out;
}
// Applies that roll to `debts`. Called by BOTH close paths just before the
// new-cycle POST, so a manual close and an automatic one leave the arrears
// figures in exactly the same place.
function applyUnpaidMinimums(list){
  const byId={};
  for(const a of list)byId[a.id]=a.amount;
  debts=debts.map(d=>byId[d.id]?{...d,arrears:Math.min(d.balance,d.arrears+byId[d.id])}:d);
}

// Snapshot of what this cycle actually paid, for archiving to history.
// Read before debts/paidThisCycle/incomeLog are cleared for the new cycle.
function getCycleArchivePayload(){
  const cyclePayments=getCyclePayments();
  // Floor-only payments belong in the archive too, at the amount that
  // actually left the pot — otherwise a floors-met cycle reads as £0 paid.
  const debtsPaid=[...paidThisCycle,...floorPaidThisCycle].map(raw=>{
    const id=Number(raw);
    const a=appliedPayments[id];
    const p=cyclePayments.find(x=>x.id===id);
    const fallback=p?(paidThisCycle.includes(id)?p.amount:(p.floorDue||0)):0;
    return {id,name:a?.name||p?.name||('Debt '+id),amount:a?a.nominal:fallback};
  }).filter(p=>p.amount>0.005);
  // Only ids that are genuinely among this cycle's payments — a stale missed
  // id (debt since cleared/edited away) shouldn't reach the history note.
  const debtsMissed=missedThisCycle.filter(id=>cyclePayments.some(p=>p.id===id));
  // Floors that weren't met this cycle become ledger entries — recorded per
  // debt, visible, and inert until the user chooses to catch up. Deliberately
  // NOT added to next cycle's required payment: automatic compounding is the
  // pressure this whole feature exists to remove.
  const fs=getFloorStatus();
  const cycleFloorShortfalls=fs.unmet.map(p=>({id:p.id,name:p.name,amount:round2(p.floorDue)}));
  const since=new Date().toLocaleDateString('en-GB',{month:'short',year:'numeric'});
  const merged=floorShortfalls.map(f=>({...f}));
  for(const nf of cycleFloorShortfalls){
    const existing=merged.find(m=>m.id===nf.id);
    if(existing){existing.amount=round2(existing.amount+nf.amount);existing.name=nf.name;}
    else merged.push({...nf,since});
  }
  // Contractual minimums left uncovered — these become arrears (see
  // getUnpaidMinimums), and are archived so History and the rollover banner
  // can say exactly what moved.
  const arrearsAdded=getUnpaidMinimums();
  return {debtsPaid,debtsMissed,bizPotClose:bizPot,perPotClose:perPot,
    floorShortfalls:merged,cycleFloorShortfalls,floorsMet:fs.floorsMet,targetMet:fs.targetMet,
    arrearsAdded};
}

// For free text (notes, loan sources) interpolated into innerHTML/attribute
// values — a note containing " or < would otherwise break the markup.
const esc=(s)=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=(n)=>'£'+Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtS=(n)=>'£'+Math.round(Math.abs(n)).toLocaleString('en-GB');
const parseNum=(s)=>{const n=parseFloat(String(s).replace(/[^0-9.]/g,''));return isNaN(n)?0:n;};
const round2=(n)=>Math.round((Number(n)||0)*100)/100;
const ord=(n)=>n+(['st','nd','rd'][n-1]||'th');

// Month 1 of the projection is the month the CURRENT cycle opened, so every
// forecast date counts forward from where you actually are. This was pinned
// to July 2026, which is why "arrears cleared" and "debt-free" never moved
// however much of the calendar went by. Falls back to today's month when the
// cycle start hasn't loaded (offline, or a fresh install).
function planStartDate(){
  const raw=cycleStatus.cycleStartedAt?new Date(cycleStatus.cycleStartedAt):null;
  const base=raw&&!isNaN(raw.getTime())?raw:new Date();
  return new Date(base.getFullYear(),base.getMonth(),1);
}
function getMonthLabel(m,short=false){
  const d=planStartDate();d.setMonth(d.getMonth()+m-1);
  return short?d.toLocaleString('en-GB',{month:'short',year:'2-digit'}):d.toLocaleString('en-GB',{month:'long',year:'numeric'});
}

function simulate(dts,bdgt){
  let state=dts.map(d=>({...d,remainingArrears:d.arrears,remaining:d.balance}));
  const months=[];
  for(let month=1;month<=360;month++){
    let bl=bdgt;const payments=[];
    for(let d of state){
      if(d.remaining<=0.005){payments.push({id:d.id,name:d.name,minPaid:0,arrearsPaid:0,extra:0,total:0,remaining:0,remainingArrears:0,cleared:true,wasActive:false});continue;}
      const interest=(d.apr/100/12)*d.remaining;d.remaining+=interest;
      const minPaid=Math.min(d.min,d.remaining);d.remaining=Math.max(0,d.remaining-minPaid);bl-=minPaid;
      payments.push({id:d.id,name:d.name,minPaid,arrearsPaid:0,extra:0,total:minPaid,remaining:d.remaining,remainingArrears:d.remainingArrears,cleared:false,wasActive:true});
    }
    const arrearsDebts=state.filter(d=>d.remainingArrears>0.005&&d.remaining>0.005);
    const inArrears=arrearsDebts.length>0;
    if(inArrears&&bl>0.005){
      // SMALLEST arrears first — snowball logic applied to arrears. The spare
      // after minimums is small (a couple of hundred a month), so pouring it
      // all into the biggest overdue balance leaves every other creditor
      // untouched for a year and a half. Clearing the small ones first takes
      // creditors off the list within a month or two, and costs nothing: the
      // spare per month is what fixes the finish date, not the order, so
      // everything still clears on the same month either way.
      const ordered=arrearsDebts.slice().sort((a,b)=>a.remainingArrears-b.remainingArrears);
      let remaining=bl;
      for(let d of ordered){
        if(remaining<=0.005)break;
        const pay=Math.min(remaining,d.remainingArrears,d.remaining);
        d.remainingArrears=Math.max(0,d.remainingArrears-pay);d.remaining=Math.max(0,d.remaining-pay);remaining-=pay;
        const pi=payments.findIndex(p=>p.id===d.id);
        payments[pi].arrearsPaid=pay;payments[pi].total+=pay;payments[pi].remaining=d.remaining;payments[pi].remainingArrears=d.remainingArrears;
        if(d.remaining<=0.005)payments[pi].cleared=true;
      }
      bl=remaining;
    }else if(!inArrears&&bl>0.005){
      const target=state.find(d=>d.remaining>0.005);
      if(target){const extra=Math.min(bl,target.remaining);target.remaining=Math.max(0,target.remaining-extra);bl-=extra;
        const pi=payments.findIndex(p=>p.id===target.id);
        payments[pi].extra=extra;payments[pi].total+=extra;payments[pi].remaining=target.remaining;
        if(target.remaining<=0.005)payments[pi].cleared=true;}
    }
    months.push({month,payments,totalOut:bdgt-bl,budgetLeft:bl,phase:inArrears?'arrears':'snowball'});
    if(state.every(d=>d.remaining<=0.005))break;
  }
  return months;
}

// Memoized simulate(debts,budget). Every real change replaces `debts` by
// reference (debts=debts.map(...) / =body.current / =s.debts), so reference
// equality is a correct cache key — renderAll, getCyclePayments and the
// what-if baselines were each re-running the full 360-month sim per render.
let simCache={debts:null,budget:null,months:null};
function getSim(){
  if(simCache.debts!==debts||simCache.budget!==budget){
    simCache={debts,budget,months:simulate(debts,budget)};
  }
  return simCache.months;
}

function getMilestones(months){const m={};for(const mo of months)for(const p of mo.payments)if(p.cleared&&p.wasActive&&!m[p.id])m[p.id]=mo.month;return m;}

// Build the "this cycle" payment list from month 1 of the sim
function getCurrentTarget(){
  // Mirrors the simulate() priority: clear arrears first (SMALLEST arrears first),
  // otherwise snowball the smallest remaining balance. Excludes zero balances
  // and any debt with no minimum payment AND no due date — i.e. nothing in
  // the payment plan at all (HMRC pre-Time-to-Pay: min 0, due null; once an
  // arrangement sets a min/due it joins the plan by itself). Data-driven so
  // new debts behave sensibly — was a hardcoded `id !== 11`.
  const active=debts.filter(d=>d.balance>0.005 && (d.min>0.005||d.due));
  const arrearsDebts=active.filter(d=>d.arrears>0.005);
  if(arrearsDebts.length){
    // smallest arrears first — matches simulate()'s payment order
    return arrearsDebts.slice().sort((a,b)=>a.arrears-b.arrears)[0];
  }
  // snowball: smallest balance overall
  return active.slice().sort((a,b)=>a.balance-b.balance)[0]||null;
}
// What a floor actually commits you to this cycle. Capped at the BALANCE —
// you can never owe more than is left — and deliberately NOT at the month's
// planned payment, which is what it used to be. Those are the same number in
// the ordinary case, but they part company twice, both times badly:
//
//  - A debt the budget never reached has a planned payment of £0, so the cap
//    rewrote a real commitment as a floor of nothing and called it met.
//  - A floor set ABOVE the minimum (the whole point of being able to edit it)
//    was quietly shrunk back to the minimum in any month with no spare.
//
// It is also the cap rollOnce() uses server-side, so the verdict the app
// shows and the one the cycle close records can no longer disagree.
// `paidOff` is what an already-applied payment took off the balance, so the
// cap is measured against the balance as it stood when the cycle opened.
function floorDueOf(debt,paidOff){
  const floor=floorOf(debt);
  if(floor===null)return null;
  const balance=(debt?Number(debt.balance)||0:0)+(Number(paidOff)||0);
  return round2(Math.min(floor,balance));
}
function getCyclePayments(){
  const months=getSim();
  const m1=months[0];
  if(!m1)return [];
  const rows=m1.payments.filter(p=>p.total>0.005).map(p=>{
    const debt=debts.find(d=>d.id===p.id);
    const floor=floorOf(debt);
    // A row whose payment has already been applied keeps showing what was
    // ACTUALLY paid. Re-running the sim would quote a different figure,
    // because it is now working off the balance that payment already
    // reduced. Unticked rows re-plan freely against the new balances, which
    // is the point: clearing one debt's arrears moves the budget on.
    const a=appliedPayments[p.id];
    const total=a?a.nominal:p.total;
    // What the plan asked for, as opposed to what went out. They're the same
    // number until a custom amount separates them, and the target is read
    // from the ledger once applied because the sim is now working off the
    // balance that payment already reduced. ?? keeps ledger entries written
    // before custom amounts existed reading as "paid exactly the target".
    const target=a?(a.target??a.nominal):p.total;
    // The arrears figures are the DEBT's, not the payment's. `arrearsAmt` is
    // the catch-up inside this month's payment; `arrearsLeft` is what stays
    // overdue once it has gone out — which is what the ARREARS badge means
    // everywhere else in the app, and what was missing here. debts[] is live,
    // so an applied payment has already come off d.arrears.
    const arrearsAmt=a?a.arrearsAmt:p.arrearsPaid;
    const arrearsLeft=round2(Math.max(0,(debt?debt.arrears:0)-(a?0:arrearsAmt)));
    return {id:p.id,name:p.name,amount:total,target,custom:!!(a&&a.custom),due:debt?.due??99,
      arrears:arrearsLeft>0.005,arrearsLeft,unfunded:false,
      snowball:a?!!a.snowball:p.extra>0.005,missed:missedThisCycle.includes(p.id),
      floorPaid:floorPaidThisCycle.includes(p.id),
      account:debt?.account||'personal',
      floor,
      // The split behind the payment, so applying a tick knows how much of it
      // is arrears catch-up (the discretionary part) rather than the
      // contractual minimum.
      minAmt:a&&a.minAmt!=null?a.minAmt:p.minPaid,arrearsAmt,
      floorDue:floorDueOf(debt,a?a.amount:0)};
  });
  // A debt this cycle's payment cleared outright drops out of month 1 — keep
  // its ticked row on the checklist rather than losing a payment you made.
  for(const raw of [...paidThisCycle,...floorPaidThisCycle]){
    const id=Number(raw);
    if(rows.some(r=>r.id===id))continue;
    const a=appliedPayments[id];
    if(!a)continue;
    const debt=debts.find(d=>d.id===id);
    const target=a.target??a.nominal;
    rows.push({id,name:debt?.name||a.name||('Debt '+id),amount:a.nominal,target,custom:!!a.custom,due:debt?.due??99,
      arrears:round2(debt?debt.arrears:0)>0.005,arrearsLeft:round2(debt?debt.arrears:0),unfunded:false,
      snowball:!!a.snowball,missed:false,
      floorPaid:floorPaidThisCycle.includes(id),account:debt?.account||'personal',
      floor:floorOf(debt),minAmt:a.minAmt??0,arrearsAmt:a.arrearsAmt,
      floorDue:floorDueOf(debt,a.amount)});
  }
  // Arrears the month's budget never reached. A debt with no contractual
  // minimum — Brewers' trade account, whose whole balance is overdue — takes
  // nothing from the sim except through the arrears queue, so in a tight
  // month its planned payment is £0 and `p.total>0.005` dropped it off the
  // checklist entirely: All Debts said £1,700.89 in arrears and the cycle it
  // belongs to never mentioned it. £0 is the honest allocation; silence is
  // not. The row goes in marked `unfunded` — visible, still payable with your
  // own amount, and counted in the floors verdict if a floor has been agreed
  // — but it asks for nothing, so it moves no pot money and no verdict.
  for(const d of debts){
    if(d.balance<=0.005||d.arrears<=0.005)continue;
    if(!(d.min>0.005||d.due))continue; // not in the payment plan at all
    if(rows.some(r=>r.id===d.id))continue;
    // A ticked payment with no ledger entry behind it (a cycle opened before
    // applied_payments existed) is settled, not waiting — leave it as it was.
    if(paidThisCycle.includes(d.id)||floorPaidThisCycle.includes(d.id))continue;
    rows.push({id:d.id,name:d.name,amount:0,target:0,custom:false,due:d.due??99,
      arrears:true,arrearsLeft:round2(d.arrears),unfunded:true,
      snowball:false,missed:missedThisCycle.includes(d.id),floorPaid:false,
      account:d.account||'personal',floor:floorOf(d),minAmt:0,arrearsAmt:0,
      floorDue:floorDueOf(d,0)});
  }
  return rows.sort((a,b)=>a.due-b.due);
}

// ---------- Floors & targets ----------
// Two numbers per debt: the TARGET (what the plan pays in an average month —
// the existing budget-driven figure) and the FLOOR (the minimum committed
// payment, sized to a worst-case income month, and the number creditors are
// held to). A cycle that meets every floor is on track even if it misses
// targets, which is the whole point: irregular income shouldn't turn one
// light month into a failed plan.
//
// null means "no floor agreed yet" and is NOT the same as a floor of £0 —
// an unset debt is left out of the floors verdict and flagged for the user
// to set, rather than being silently counted as a commitment of nothing.
function floorOf(d){
  const f=d&&d.floorPayment;
  if(f===null||f===undefined||f==='')return null;
  const n=Number(f);
  return isFinite(n)&&n>=0?n:null;
}
// Arrears first (smallest arrears first, matching simulate()), then earliest
// due date — the order floors get funded in when income can't cover them all.
function floorPriority(a,b){
  const da=debts.find(x=>x.id===a.id),db_=debts.find(x=>x.id===b.id);
  const aa=da?.arrears||0,ba=db_?.arrears||0;
  if((aa>0.005)!==(ba>0.005))return aa>0.005?-1:1;
  if(Math.abs(aa-ba)>0.005)return aa-ba;
  return a.due-b.due;
}
// The cycle's standing on both numbers. Everything the Cash Flow view needs
// to say "floors met / target met" and how much is still uncovered.
function getFloorStatus(){
  const payments=getCyclePayments();
  let floorTotal=0,floorPaid=0,outstandingBiz=0,outstandingPer=0,noFloorSet=0;
  const unmet=[];
  for(const p of payments){
    if(p.floorDue===null){noFloorSet++;continue;}
    floorTotal+=p.floorDue;
    // A floor is settled by money, not by which tick was used: paying the
    // target in full or the floor on its own both clear it by construction,
    // and a custom amount clears it if it reaches. One that doesn't leaves
    // the floor unmet even though the payment is ticked — which is the
    // honest answer, and what puts it on the catch-up ledger at close.
    if(paidAmountOf(p)>=p.floorDue-0.005){floorPaid+=p.floorDue;continue;}
    unmet.push(p);
    // A deliberately missed debt still counts as an unmet floor (that's the
    // signal worth having), but no money is set aside for it.
    if(!p.missed){
      if(p.account==='business')outstandingBiz+=p.floorDue; else outstandingPer+=p.floorDue;
    }
  }
  const withFloor=payments.filter(p=>p.floorDue!==null);
  // The targets, not the amounts that went out — so "£x to go" still counts
  // the gap left by a floor-only or under-target custom payment.
  const targetTotal=payments.filter(p=>!p.missed).reduce((s,p)=>s+p.target,0);
  // What actually went out, whatever route it took.
  const targetPaid=payments.reduce((s,p)=>s+paidAmountOf(p),0);
  return {
    payments,unmet,noFloorSet,floorTotal,floorPaid,targetTotal,targetPaid,
    outstandingBiz,outstandingPer,
    // Money already in the pots against the floors still to pay.
    shortBy:Math.max(0,outstandingBiz-bizPot)+Math.max(0,outstandingPer-perPot),
    floorsMet:withFloor.length>0&&unmet.length===0,
    // Stricter than the surplus prompt's allDone: a deliberately missed debt
    // means the target wasn't hit, even though the floors verdict is what
    // decides whether the cycle counts as on track.
    targetMet:payments.length>0&&payments.every(p=>paidAmountOf(p)>=p.target-0.005)
  };
}
// One month of CONTRACTUAL MINIMUMS, split the way the pots are. This is the
// number a month-ahead buffer has to reach, and it is deliberately the
// minimums rather than the floors: missing a floor writes an inert entry on
// the catch-up ledger, missing a minimum is money genuinely overdue. Same
// "in the payment plan" rule as getCurrentTarget() — a live balance and
// either a minimum or a due date — and each minimum capped at its balance.
function monthlyMinimums(){
  let biz=0,per=0;
  for(const d of debts){
    if(d.balance<=0.005)continue;
    if(!(d.min>0.005||d.due))continue;
    const m=Math.min(Number(d.min)||0,d.balance);
    if(m<=0.005)continue;
    if(d.account==='business')biz+=m; else per+=m;
  }
  return {biz:round2(biz),per:round2(per),total:round2(biz+per)};
}
// What must actually leave each pot this cycle for nothing to go wrong: for
// every payment still owing, the HIGHER of its floor and its contractual
// minimum, less whatever has already gone out.
//
// Both numbers, because they fail differently and the buffer exists to stop
// both. The floor is the commitment — miss it and the shortfall goes on the
// catch-up ledger. The minimum is contractual — miss it and it becomes
// arrears. A floor set BELOW the minimum (Currys: floor £50.73, minimum
// £101.46) meets its commitment and still leaves £50.73 to go overdue, so
// funding floors alone would let a full buffer sit there while arrears grew.
// That is what getFloorStatus()'s outstanding figures alone would have done.
function cycleCommitments(){
  let biz=0,per=0;
  for(const p of getFloorStatus().payments){
    if(p.missed)continue;
    const debt=debts.find(d=>d.id===p.id);
    const minDue=Math.min(Number(debt?.min)||0,(debt?.balance||0)+(appliedPayments[p.id]?.amount||0));
    const owed=Math.max(p.floorDue||0,minDue);
    const left=Math.max(0,owed-paidAmountOf(p));
    if(left<=0.005)continue;
    if(p.account==='business')biz+=left; else per+=left;
  }
  return {biz:round2(biz),per:round2(per),total:round2(biz+per)};
}
// What the buffer could put into the pots right now against those
// commitments — the whole reason for holding it. Per account, because
// neither jar can rescue the other. At the start of a cycle, with nothing
// paid and the pots empty, this is the whole month: exactly the "move the
// float across on the 1st" that being a month ahead means.
function bufferCover(){
  const need=cycleCommitments();
  const gapBiz=round2(Math.max(0,need.biz-bizPot));
  const gapPer=round2(Math.max(0,need.per-perPot));
  const biz=round2(Math.min(gapBiz,bufferBiz)),per=round2(Math.min(gapPer,bufferPer));
  return {biz,per,total:round2(biz+per),gapBiz,gapPer,need,
    // What the buffer cannot reach: the pot is short and its own jar is empty.
    stillShort:round2(Math.max(0,gapBiz-biz)+Math.max(0,gapPer-per))};
}
// How far the stored target has drifted from a month of TODAY's minimums.
// The target is a snapshot taken when a preset was tapped; the plan moves
// under it as debts clear, minimums change and new debts arrive. Positive =
// holding more than a month costs (safe, but money sitting idle); negative =
// "a month ahead" is not true any more.
function bufferDrift(){
  const mm=monthlyMinimums();
  const drift=round2(bufferTarget()-mm.total);
  return {mm,drift,matters:bufferTarget()>0.005&&Math.abs(drift)>1};
}
// Where a pay-in goes, in the spec's order: buffer, then floors (arrears
// first), then savings, then whatever the ordinary sweep has left for
// targets, then living money. Floors come OUT OF the sweep rather than on
// top of it, so a month whose floors are already covered splits exactly as
// it did before this feature existed.
function allocateIncome(amt){
  const gross=Math.max(0,amt);
  // The two buffer jars fill together, in proportion to what each still
  // needs, so a light month can't top one account to the brim while the
  // other — the one with a minimum falling due — stays empty.
  const needBufBiz=Math.max(0,bufferTargetBiz-bufferBiz);
  const needBufPer=Math.max(0,bufferTargetPer-bufferPer);
  const bufferWanted=needBufBiz+needBufPer;
  const buffer=Math.min(gross,bufferWanted);
  const bufBiz=bufferWanted>0.005?round2(buffer*needBufBiz/bufferWanted):0;
  const bufPer=round2(buffer-bufBiz);
  let rem=gross-buffer;
  // Pot balances count toward the floors before any new money does.
  let creditBiz=bizPot,creditPer=perPot,floorBiz=0,floorPer=0;
  for(const p of getFloorStatus().unmet.filter(x=>!x.missed).sort(floorPriority)){
    const isBiz=p.account==='business';
    const credit=isBiz?creditBiz:creditPer;
    const used=Math.min(credit,p.floorDue);
    if(isBiz)creditBiz-=used; else creditPer-=used;
    const gap=p.floorDue-used;
    if(gap<=0.005||rem<=0.005)continue;
    const add=Math.min(rem,gap);
    if(isBiz)floorBiz+=add; else floorPer+=add;
    rem-=add;
  }
  const savings=Math.min(rem,gross*savingsPct/100);
  rem-=savings;
  // Targets get the rest of the sweep — the floor money already spent counts
  // against it, so this is a top-up to target, not a second helping.
  const targetSweep=Math.max(0,Math.min(rem,gross*sweepPct/100-floorBiz-floorPer));
  const {businessTotal,personalTotal}=getCycleTotals();
  const needBiz=Math.max(0,businessTotal-bizPot-floorBiz);
  const needPer=Math.max(0,personalTotal-perPot-floorPer);
  let tBiz;
  if(needBiz+needPer>0.005)tBiz=targetSweep*needBiz/(needBiz+needPer);
  else if(businessTotal+personalTotal>0.005)tBiz=targetSweep*businessTotal/(businessTotal+personalTotal);
  else tBiz=targetSweep/2;
  const tPer=targetSweep-tBiz;
  rem-=targetSweep;
  return {buffer,bufferBiz:bufBiz,bufferPer:bufPer,
    biz:floorBiz+tBiz,per:floorPer+tPer,savings,keep:Math.max(0,rem),
    floorBiz,floorPer,floorFunded:floorBiz+floorPer,targetSweep};
}

          <div style="font-weight:700;color:#5b8def">${fmt(nextDue.amount)}</div>
        </div>
      </div>`;
    }
    cyclePayments.forEach((p,i)=>{
      const state=paymentState(p.id);
      const done=state==='paid';
      const floorOnly=state==='floor';
      const missed=state==='missed';
      const custom=state==='custom';
      // A debt in arrears the budget never reached this cycle. It is on the
      // list so the overdue money is visible, not so it can be ticked: there
      // is nothing to pay against, only an amount you could choose to send.
      const unfunded=p.unfunded;
      // Struck through and settled either way — the difference is only
      // whether the amount was the plan's or the user's.
      const settled=done||custom;
      const overTarget=custom&&p.amount>p.target+0.005;
      const debt=debts.find(d=>d.id===p.id);
      // "Paid the floor" is only a distinct choice when the floor is actually
      // less than the target — otherwise paying the floor IS paying in full.
      const floorIsLess=p.floorDue!==null&&p.floorDue<p.target-0.005;
      // Ticked at an amount that doesn't reach the floor is a real state —
      // the payment happened, the commitment still didn't — so the floor
      // figure stays amber rather than greying out with the rest of the row.
      const floorSettled=p.floorDue!==null&&paidAmountOf(p)>=p.floorDue-0.005;
      const customNote=Math.abs(p.amount-p.target)<=0.005?'Your own amount'
        :overTarget?`${fmt(p.amount-p.target)} over the ${fmt(p.target)} target`
        :`${fmt(p.target-p.amount)} under the ${fmt(p.target)} target`;
      const link=(fn,label,color)=>`<button onclick="${fn}(${p.id})" style="background:none;border:none;padding:2px 0 0;font-size:10px;font-weight:600;color:${color};text-decoration:underline">${label}</button>`;
      html+=`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;${i<cyclePayments.length-1?'border-bottom:1px solid #2a2d3e':''}">
        ${unfunded
          ?`<div class="check" style="border-color:#4a2020;color:#e05c5c;font-weight:700">!</div>`
          :`<button class="check ${done?'done':''}" onclick="${custom?'undoPayment':'togglePaid'}(${p.id})" style="${missed?'opacity:.35':''}${floorOnly?'border-color:#7db87d;color:#7db87d':''}${custom?'border-color:#5b8def;color:#5b8def':''}">${done?'✓':floorOnly?'◐':custom?'✓':''}</button>`}
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span style="font-weight:600;${settled?'color:#555;text-decoration:line-through':missed?'color:#7c7f96':''}">${esc(p.name)}</span>
            ${debt?.account==='business'?'<span class="badge" style="background:#2a1a0a;color:#e0923b">BIZ</span>':'<span class="badge" style="background:#0a1228;color:#5b8def">PER</span>'}
            ${missed?'<span class="badge" style="background:#3a2a0a;color:#e0923b">MISSED</span>':''}
            ${floorOnly?'<span class="badge badge-green">FLOOR PAID</span>':''}
            ${custom?'<span class="badge badge-blue">OWN AMOUNT</span>':''}
            ${p.arrears?'<span class="badge badge-red">ARREARS</span>':''}
            ${p.snowball&&!settled&&!missed&&!floorOnly?'<span class="badge badge-blue">SNOWBALL</span>':''}
          </div>
          <div style="font-size:11px;color:#555;margin-top:1px">${unfunded?`${p.due<99?'Due '+ord(p.due):'Flexible date'} · <span style="color:#e0923b">waiting for budget</span>`:missed?'Skipped this cycle — no budget set aside':custom?customNote:floorOnly?`Floor met · ${fmt(Math.max(0,p.target-p.floorDue))} under target`:(p.due<99?'Due '+ord(p.due):'Flexible date')}${p.floorDue!==null&&!floorOnly?` · floor <span style="color:${floorSettled?'#555':settled||missed?'#e0923b':'#7c7f96'}">${fmt(p.floorDue)}</span>`:''}${p.floorDue===null&&!unfunded?' · <span style="color:#e0923b">no floor set</span>':''}${p.arrearsLeft>0.005?` · <span style="color:#e05c5c">${fmt(p.arrearsLeft)} still overdue</span>`:''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-weight:700;color:${unfunded?'#555':custom?'#5b8def':done||missed?'#555':floorOnly?'#7db87d':'#e8e8ec'};${settled||missed?'text-decoration:line-through':''}">${unfunded?'—':floorOnly?fmt(p.floorDue):fmt(p.amount)}</div>
          ${done?'':`<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;max-width:176px;margin-left:auto">
            ${unfunded?link('openCustomPayModal','pay some of it','#5b8def'):custom?link('openCustomPayModal','change amount','#5b8def')+link('undoPayment','undo','#555'):`
            ${floorIsLess||floorOnly?link('togglePaidFloor',floorOnly?'undo floor':'paid floor only','#7db87d'):''}
            ${floorOnly?'':link('toggleMissed',missed?'undo missed':'missed this cycle?',missed?'#e0923b':'#555')}
            ${missed?'':link('openCustomPayModal','own amount','#5b8def')}`}
          </div>`}
        </div>
      </div>`;
    });
    // Debts with no planned payment this cycle still take money — a trade
    // account with no minimum, HMRC before a Time to Pay arrangement — so a
    // lump sum has to be able to reach one that isn't on the checklist.
    const offPlan=debts.filter(d=>d.balance>0.005&&!cyclePayments.some(p=>p.id===d.id));
    html+=`<div style="display:flex;gap:8px;margin-top:14px">
      ${offPlan.length?`<button class="btn-ghost" style="flex:1" onclick="openPayOtherModal()">Pay another debt</button>`:''}
      <button class="btn-ghost" style="flex:1" onclick="startNewCycle()">Start new cycle</button>
    </div></div>`;

    // HMRC reminder
    const hmrc=debts.find(d=>d.id===11);
    html+=`<div class="card card-yellow">
      <div class="row"><div><div style="font-weight:600">HMRC — ${fmt(hmrc?.balance??0)}</div>
      <div style="font-size:12px;color:#b5b07c;margin-top:2px">Call 0300 200 3835 to set up Time to Pay</div></div></div>
    </div>`;

    // Income log
    if(incomeLog.length){
      html+=`<div class="card"><h2>Money in this cycle</h2>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:#7c7f96">
          <span>In: <strong style="color:#e8e8ec">${fmt(totalIn)}</strong></span>
          <span>Biz pot: <strong style="color:#e0923b">${fmt(incomeLog.reduce((s,e)=>s+(e.bizAmt||0),0))}</strong></span>
          <span>Per pot: <strong style="color:#5b8def">${fmt(incomeLog.reduce((s,e)=>s+(e.perAmt||0),0))}</strong></span>
        </div>`;
      incomeLog.slice().reverse().forEach((e,ri)=>{
        const realIdx=incomeLog.length-1-ri;
        html+=`<div class="log-item">
          <span style="color:#7c7f96">${e.date}</span>
          <span style="font-size:12px">In: <strong>${fmt(e.amount)}</strong> · Biz: <strong style="color:#e0923b">${fmt(e.bizAmt||0)}</strong> · Per: <strong style="color:#5b8def">${fmt(e.perAmt||0)}</strong>${e.savedAmt>0?` · Saved: <strong style="color:#7db87d">${fmt(e.savedAmt)}</strong>`:''}${e.bufferAmt>0?` · Buffer: <strong style="color:#7db87d">${fmt(e.bufferAmt)}</strong>`:''}</span>
          <button onclick="deleteIncome(${realIdx})" style="background:none;border:none;color:#e05c5c;font-size:16px;padding:0 4px">×</button>
        </div>`;
