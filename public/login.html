<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a5276">
<title>Sign in — NH Estimator</title>
<style>
  :root {
    --accent: #1a5276; --bg: #eef1f4; --surface: #ffffff;
    --text: #1e2833; --text2: #5b6b78; --border: #d8dee4; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10141a; --surface: #1a212b; --text: #e8edf2; --text2: #97a4b0; --border: #2a3441; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 360px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 24px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
    text-align: center;
  }
  .logo { height: 44px; width: auto; object-fit: contain; margin-bottom: 6px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { font-size: 13px; color: var(--text2); margin: 0 0 20px; }
  input[type=password] {
    width: 100%; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); outline: none;
  }
  input[type=password]:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 12px; padding: 12px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #fff; border: 0; border-radius: 10px; cursor: pointer;
  }
  button:active { opacity: .85; }
  .error { display: none; color: var(--danger); font-size: 13px; margin: 12px 0 0; }
</style>
</head>
<body>
  <!-- No autocomplete="off" on the form: it was suppressing the offer to
       save the password in iCloud Keychain / a password manager, which is
       the difference between the rare re-login being a Face ID tap and
       being a typed password. The input below asks for current-password
       explicitly, which is the signal we actually want honoured. -->
  <form class="card" method="POST" action="/auth/login">
    <img class="logo" id="brand-logo" src="/logo.png" alt="" onerror="this.style.display='none'">
    <h1 id="brand-title">NH Estimator</h1>
    <p class="sub">Enter the app password to sign in</p>
    <input type="password" name="password" placeholder="Password" autofocus
           autocapitalize="off" autocorrect="off" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p class="error" id="err-wrong">Wrong password — try again.</p>
    <p class="error" id="err-locked">Too many attempts — wait 15 minutes and try again.</p>
  </form>
  <script>
    var err = new URLSearchParams(location.search).get('error');
    if (err === 'locked') document.getElementById('err-locked').style.display = 'block';
    else if (err) document.getElementById('err-wrong').style.display = 'block';

    // White-label branding: uploaded logo → business name only (stock logo
    // hidden) → stock logo + "NH Estimator" when nothing is configured.
    fetch('/api/branding').then(function (r) { return r.json(); }).then(function (b) {
      var img = document.getElementById('brand-logo');
      if (b.businessName) {
        document.getElementById('brand-title').textContent = b.businessName;
        document.title = 'Sign in — ' + b.businessName;
      }
      if (b.logoDataUri) img.src = b.logoDataUri;
      else if (b.businessName) img.style.display = 'none';
    }).catch(function () {});
  </script>
</body>
</html>
